<!doctype html>
<html lang="it" data-theme="dark">

<title>LeviathADM Web</title>
<style>
:root { --bg: #ffffff; --fg: #1e293b; --muted: #64748b; --card: #ffffff; --border: #e2e8f0; --zebra: #e2e8f0;
        --hover: #cbd5e1; --header: #1e293b; --header-fg: #ffffff; --primary: #1e40af; --drawer: rgba(30,41,59,.16);
        --amber-bg: #fef3c7; --amber-fg: #92400e; --green: #166534; --red: #991b1b; }
html[data-theme="dark"] { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --card: #1e293b; --border: #334155;
        --zebra: #273449; --hover: #334155; --header: #1e293b; --header-fg: #ffffff; --primary: #3b82f6;
        --drawer: #1e293b; --amber-bg: #78350f; --amber-fg: #fcd34d; --green: #86efac; --red: #fca5a5; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
a { color: var(--primary); }
button { font: inherit; cursor: pointer; border: 1px solid var(--primary); background: transparent; color: var(--primary);
         border-radius: 4px; padding: 4px 10px; }

button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border);
         border-radius: 4px; padding: 4px 6px; }

.lv-drawer a:hover { background: var(--hover); }

.toast.avviso { border-left-color: #d97706; } .toast.errore { border-left-color: #dc2626; } .toast.ok { border-left-color: #16a34a; }

th.asc::after { content: ' ▲'; } th.desc::after { content: ' ▼'; } table.grande thead th { cursor: pointer; user-select: none; }

details summary { cursor: pointer; } table.grande tbody tr { cursor: pointer; } table.grande tbody tr:focus { outline: 2px solid var(--primary); outline-offset: -2px; }
.riga { display: flex; align-items: center; gap: 10px; } h2 { margin: 8px 0; }

.stepper { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; } .step { border-radius: 16px; } .step.attivo { background: var(--primary); color: #fff; }

.campo input[type=text], .campo input:not([type]), .campo input[type=email], .campo select { min-width: 180px; flex: 1; }
.campo-data .picker { width: 34px; padding: 2px; flex: none; } button.nuova-persona { padding: 2px 8px; flex: none; }

.lv-dialog::backdrop { background: rgba(0, 0, 0, .4); } .lv-dialog form { display: flex; flex-direction: column; gap: 8px; }

.due-colonne { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .due-colonne textarea, form.editor textarea { width: 100%; font: inherit; }
.lv-riga { padding: 4px 6px; border-radius: 4px; } .lv-riga:nth-child(even) { background: var(--zebra); } .sezione b { display: block; margin-bottom: 6px; }

<body>
<div id="app"></div>
<script>
/* === 00_base.js === */
/* LeviathADM Web — base: namespace, escape HTML, eventi. Script classico: nessun import/export. */
window.LV = window.LV || {};
(function (LV) {
  'use strict';
  LV.VERSIONE = '1.5.0';   // versioning dal 2026-10-19: un documento per versione in docs/versioni/ (test_versioni.py)
  LV.esc =(s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ascolto = {};
  LV.on = (nome, fn) => { (ascolto[nome] ||= []).push(fn); };
  LV.emit = (nome, dati) => { for (const fn of ascolto[nome] || []) fn(dati); };
})(window.LV);

/* === 10_markdown.js === */
/* Parser puri del markdown del vault: traduzione 1:1 di scripts/mail_utils.parse_frontmatter e
   leviathadm/vault/parsers.py (stessi regex, stessi casi limite). Verificati dai golden. */
(function (LV) {
  'use strict';
  const FM_SEARCH = /^---[ \t]*\n([\s\S]*?)\n---/;                 // parse_frontmatter: re.search con ^ = inizio testo
  const FM_STRIP = /^---[ \t]*\n[\s\S]*?\n---[ \t]*\n?/;             // _FM_RE
  const H2_SPLIT = /^## +(.+?) *\n/m;                                 // _H2_RE
  const H1 = /^# +(.+?) *$/m;                                         // _H1_RE
  const CHECK = /^- \[( |x|X)\] (.+?)\s*$/gm;                         // _CHECK_RE
  const BULLET = /^[-*]\s+(.+?)\s*$/gm;                               // _BULLET_RE
  const WIKI = /(!?)\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g; // _WIKI_RE
  const TAG = /(?<![\p{L}\p{N}_/#])#([A-Za-z][\p{L}\p{N}_\-]*)/gu;      // _TAG_RE: \w di Python è Unicode, quello di JS no
  const TITOLO_MD = /^\s*#{1,6}\s/;
  const SEP_CELLA = /^[-: ]*$/;

  function parseFrontmatter(text) {
    const m = FM_SEARCH.exec(text || '');
    if (!m) return {};
    const fm = {};
    for (const line of m[1].split(/\r?\n/)) {
      if (line.includes(':')) {
        const i = line.indexOf(':');
        fm[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      }
    }
    return fm;
  }
  function splitBody(text) {
    text = text || '';
    return text.startsWith('---') ? text.replace(FM_STRIP, '') : text;
  }
  function splitSections(body) {
    const parts = (body || '').split(H2_SPLIT);   // come re.split con gruppo: [pre, h1, b1, h2, b2, …]
    const out = {};
    for (let i = 1; i < parts.length - 1; i += 2) out[parts[i].trim()] = parts[i + 1];
    return out;
  }
  function parseTable(section) {
    const rows = [];
    let headerSaltato = false;
    for (const line of (section || '').split('\n')) {
      const s = line.trim();
      if (!s.startsWith('|')) { if (rows.length) break; continue; }
      const cells = s.replace(/^\|+|\|+$/g, '').split('|').map((c) => c.trim());
      if (cells.every((c) => SEP_CELLA.test(c))) continue;
      if (!headerSaltato) { headerSaltato = true; continue; }
      rows.push(cells);
    }
    return rows;
  }
  const tutti = (re, s) => Array.from((s || '').matchAll(re));
  const parseCheckboxes = (s) => tutti(CHECK, s).map((m) => [m[1] !== ' ', m[2]]);
  const parseBullets = (s) => tutti(BULLET, s).map((m) => m[1]);
  const parseWikilinks = (s) => tutti(WIKI, s).map((m) => ({ target: m[2].trim(), alias: m[3] ? m[3].trim() : null, embed: m[1] === '!' }));
  function parseTags(text) {
    const tags = [];
    for (const line of (text || '').split('\n')) {
      if (TITOLO_MD.test(line)) continue;
      for (const m of line.matchAll(TAG)) if (!tags.includes(m[1])) tags.push(m[1]);
    }
    return tags;
  }
  function stripMarkdownInline(text) {
    return (text || '').replace(WIKI, (_, b, t, a) => (a || t).trim()).replace(/\*\*(.+?)\*\*/g, '$1').replace(/`/g, '');
  }
  const pad2 = (n) => String(n).padStart(2, '0');
  function parseData(raw) {
    const s = (raw || '').trim();
    if (!s) return null;
    let a, me, g;
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);          // strptime %m/%d accettano anche una cifra
    if (m) [a, me, g] = [m[1], m[2], m[3]];
    else if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s))) [a, me, g] = [m[3], m[2], m[1]];
    else return null;
    const d = new Date(Date.UTC(+a, +me - 1, +g));
    if (d.getUTCFullYear() !== +a || d.getUTCMonth() !== +me - 1 || d.getUTCDate() !== +g) return null;  // 30/02
    return `${a}-${pad2(me)}-${pad2(g)}`;
  }
  const normalizza = (text) => (text || '').normalize('NFKD').replace(/\p{M}/gu, '').toLowerCase();   // parsers.normalizza: minuscolo senza accenti
  function titoloH1(text) {
    const m = H1.exec(text || '');
    return m ? m[1].trim() : null;
  }
  const FM_UPDATE = /^---[ \t]*\n([\s\S]*?)\n---[ \t]*\n?([\s\S]*)/;   // update_frontmatter_keys: re.match con DOTALL
  function updateFrontmatterKeys(text, updates) {
    // mail_utils.update_frontmatter_keys: chiavi esistenti aggiornate al loro posto, nuove in coda, corpo intatto;
    // senza frontmatter il testo torna invariato (Python non scrive nulla)
    const m = FM_UPDATE.exec(text || '');
    if (!m) return text || '';
    const [, raw, body] = m;
    const out = [], visti = new Set();
    const righe = raw === '' ? [] : raw.split('\n');                 // splitlines(): una stringa vuota dà [] e l'ultima riga vuota (raw che finisce con \n) non conta
    if (righe.length && righe.at(-1) === '' && raw.endsWith('\n')) righe.pop();
    for (const line of righe) {
      if (line.includes(':')) {
        const k = line.slice(0, line.indexOf(':')).trim();
        if (Object.hasOwn(updates, k)) { out.push(`${k}: ${updates[k]}`); visti.add(k); continue; }
      }
      out.push(line);
    }
    for (const [k, v] of Object.entries(updates)) if (!visti.has(k)) out.push(`${k}: ${v}`);
    return `---\n${out.join('\n')}\n---\n${body}`;
  }
  LV.md = { parseFrontmatter, splitBody, splitSections, parseTable, parseCheckboxes, parseBullets, parseWikilinks,
            parseTags, stripMarkdownInline, parseData, titoloH1, updateFrontmatterKeys, normalizza };
})(window.LV);

/* === 20_modelli.js === */
/* Modelli del vault: traduzione di leviathadm/vault/loader.py e paths.py. I percorsi sono stringhe POSIX
   relative alla root ("PO 2026/ADM.../ADM....md"); le date sono ISO o null. */
(function (LV) {
  'use strict';
  const M = LV.md;
  const RESOCONTO_RE = /^(ADM[0-9A-Z-]+) - (\d{8}) Resoconto (.+?)(?: - rev\s*\d+|-rev.*)?$/;
  const SCADENZA_RE = /scadenza:\s*(\d{4}-\d{2}-\d{2}|\d{2}\/\d{2}\/\d{4})/i;
  const LINK_RE = /\[\[([^\]|]+)/;
  const COMMENTO_RE = /<!--[\s\S]*?-->/g;
  const parti = (rel) => rel.split('/');
  const nome = (rel) => parti(rel).at(-1);
  const stemDi = (rel) => nome(rel).replace(/\.md$/, '');
  const cartella = (rel) => parti(rel).slice(0, -1).join('/');

  const notaId = (rel) => rel.replace(/\.md$/, '').replaceAll('/', '~');
  function isSchedaRilascio(rel) {
    const p = parti(rel);
    if (p.length < 2 || !rel.endsWith('.md')) return false;
    const dir = p.at(-2);
    return stemDi(rel) === dir && dir.startsWith('ADM') && !dir.includes('(');
  }
  function tipoNota(rel, fm) {
    if (isSchedaRilascio(rel)) return 'rilascio';
    const t = (fm.tipo || '').trim().toLowerCase();
    if (['progetto', 'sottoprogetto', 'ufficio'].includes(t)) return t;
    const p = parti(rel);
    if (p[0] === 'Anagrafica') return p.length > 2 && p[1] === 'Strutture' ? 'ufficio' : 'persona';
    if (p.length === 2 && p[0].startsWith('PO ')) return 'pagina';
    return 'nota';
  }
  function parseNota(rel, text, lastModified) {
    const fm = M.parseFrontmatter(text);
    const corpo = M.splitBody(text);
    return { rel, id: notaId(rel), titolo: M.titoloH1(corpo) || stemDi(rel), frontmatter: fm, corpo,
             wikilink: M.parseWikilinks(corpo), tag: M.parseTags(corpo), tipo: tipoNota(rel, fm), lastModified };
  }
  const pulisci = (s) => (s || '').replace(COMMENTO_RE, '').trim();
  function riunioni(sez) {
    const out = [];
    for (const row of M.parseTable(sez)) {
      let data, fase, trascritto, resoconto, inviato;
      if (row.length === 5) [data, fase, trascritto, resoconto, inviato] = row;
      else if (row.length === 4) { [data, fase, resoconto, inviato] = row; trascritto = ''; }
      else continue;
      if (['', '—', '-'].includes(data)) continue;
      const m = LINK_RE.exec(resoconto);
      out.push({ data, fase, trascritto, resoconto_link: m ? m[1].trim() : '', inviato: inviato.includes('✅'), raw_row: row });
    }
    return out;
  }
  const azioni = (sez) => M.parseCheckboxes(sez).map(([chiusa, testo]) => {
    const m = SCADENZA_RE.exec(testo);
    return { chiusa, testo, testo_pulito: M.stripMarkdownInline(testo), scadenza: m ? M.parseData(m[1]) : null };
  });
  const decisioni = (sez) => M.parseBullets(sez).map((testo) => {
    const i = testo.indexOf(' — ');
    const prefisso = i >= 0 ? testo.slice(0, i) : testo;
    const resto = i >= 0 ? testo.slice(i + 3) : '';
    const d = i >= 0 ? M.parseData(prefisso) : null;
    return { data: d, testo: M.stripMarkdownInline(d ? resto : testo) };
  });
  const protocolli = (sez) => M.parseTable(sez).filter((r) => r.length >= 6)
    .map((r) => ({ tipo: r[0], documento: r[1], numero_adm: r[2], data_adm: r[3], rif_sogei: r[4], registro: r[5] }));

  function parseResoconto(rel, text, pres) {
    const fm = M.parseFrontmatter(text);
    const stem = stemDi(rel);
    const m = RESOCONTO_RE.exec(stem);
    const tipo = (fm.tipo_riunione || '').trim() || (m ? m[3] : '');
    let data = M.parseData(fm.data_riunione || '');
    if (data === null && m) { const g = m[2]; data = M.parseData(`${g.slice(0, 4)}-${g.slice(4, 6)}-${g.slice(6)}`); }
    const inInviati = parti(rel).includes('inviati');
    let stato = 'bozza';
    if ((fm.definitivo_inviato || '').toLowerCase() === 'true') stato = 'definitivo';
    else if ((fm.inviato || '').toLowerCase() === 'true' || inInviati) stato = 'inviato';
    return { rel, stem, tipo_riunione: tipo, data_riunione: data, stato, in_inviati: inInviati,
             ha_docx: !!pres.haDocx, ha_msg: !!pres.haMsg, ha_pdf: !!pres.haPdf, frontmatter: fm };
  }
  const ordinaResoconti = (lista) => [...lista].sort((a, b) => {
    const da = a.data_riunione || '', db = b.data_riunione || '';     // null = date.min
    return da < db ? -1 : da > db ? 1 : a.stem < b.stem ? -1 : a.stem > b.stem ? 1 : 0;
  });
  function parseRilascio(rel, text, lastModified, resoconti, verbali) {
    const fm = M.parseFrontmatter(text);
    const corpo = M.splitBody(text);
    const sez = M.splitSections(corpo);
    const problemi = [];
    if (!fm.codice_rilascio) problemi.push('frontmatter senza codice_rilascio');
    for (const n of ['Riunioni', 'Azioni aperte', 'Decisioni chiave', 'Prossima riunione']) if (!(n in sez)) problemi.push(`sezione mancante: ${n}`);
    const stato = fm.stato || '';
    return { codice: fm.codice_rilascio || stemDi(rel), rel, id: notaId(rel), lastModified, frontmatter: fm, stato,
             descrizione_rilascio: fm.descrizione_rilascio || '', riunioni: riunioni(sez.Riunioni || ''),
             azioni: azioni(sez['Azioni aperte'] || ''), decisioni: decisioni(sez['Decisioni chiave'] || ''),
             protocolli: protocolli(sez['Allegati protocolli'] || ''),
             prossima_riunione: M.stripMarkdownInline(pulisci(sez['Prossima riunione'] || '')),
             team_raw: (sez.Team || '').trim(), resoconti: ordinaResoconti(resoconti || []), verbali: [...(verbali || [])].sort(),
             sezioni: sez, problemi, attivo: stato.trim().toLowerCase() !== 'rinominato' };
  }
  LV.modelli = { RESOCONTO_RE, notaId, isSchedaRilascio, tipoNota, parseNota, parseResoconto, ordinaResoconti, parseRilascio, cartella, nome, stemDi, riunioni };
})(window.LV);

/* === 25_scrittura.js === */
/* Writer puri (testi da scrivere) e regole dei moduli: traduzione di writers.crea_persona,
   build_project_pages.write_release_page (scheda nuova) e delle regole di rilascio_modifica.py. */
(function (LV) {
  'use strict';
  const M = LV.md;
  const STATI = ['Da Avviare', 'Bozza', 'Startup', 'In corso', 'Analisi', 'In Verifica', 'Collaudo', 'Concluso'];
  const CAMPI_TEAM = [['pm', 'PM'], ['ra', 'RA'], ['rp', 'RP'], ['struttura_business', 'Struttura business'],
                      ['referente_business', 'Referente business'], ['referente_sogei', 'Referente SOGEI']];
  const CAMPI_DATE = [['data_fine_analisi', 'Fine analisi'], ['data_disponibilita_collaudo', 'Disponibilità collaudo'],
                      ['data_collaudo_prevista', 'Collaudo previsto'], ['data_collaudo_effettiva', 'Collaudo effettivo'],
                      ['data_rilascio_prevista', 'Rilascio previsto'], ['data_rilascio_effettiva', 'Rilascio effettivo']];
  const CAMPI_PROTOCOLLI = [['protocollo_analisi', 'Analisi'], ['protocollo_approvazione_analisi', 'Approvazione analisi'],
                           ['protocollo_disponibilita_collaudo', 'Disponibilità a collaudo'], ['protocollo_collaudo', 'Collaudo'],
                           ['protocollo_estensione_esercizio', 'Estensione esercizio']];
  const CODICE_RE = /^ADM\d{3}-\d{2}-[0-9A-Z]{2}$/;
  const VIETATI = /[\\/:*?"<>|]/;

  function validaDateIso(valori) {
    for (const [campo, label] of CAMPI_DATE) {
      const v = (valori[campo] || '').trim();
      if (!v || v === 'DA COMPLETARE') continue;
      const iso = M.parseData(v);
      if (iso === null) return `Data "${label}" non valida: usa AAAA-MM-GG.`;
      valori[campo] = iso;
    }
    return null;
  }
  const diffCampi = (valori, iniziali) => Object.fromEntries(Object.entries(valori).filter(([k, v]) => !Object.hasOwn(iniziali, k) || v !== iniziali[k]));

  function creaPersonaTesto(nome, { organizzazione = 'ADM', direzione = '', ufficio = '', email = '', ruolo_tipico = '' } = {}) {
    nome = (nome || '').split(/\s+/).filter(Boolean).join(' ');
    if (!nome) throw new Error('nome vuoto');
    if (VIETATI.test(nome)) throw new Error('il nome non può contenere \\ / : * ? " < > |');
    const link = [direzione, ufficio].filter(Boolean);
    const text = `---\norganizzazione: ${organizzazione}\ndirezione: ${direzione}\nufficio: ${ufficio}\nemail: ${email}\nruolo_tipico: ${ruolo_tipico}\n---\n\n# ${nome}\n\n`
      + (link.length ? link : [organizzazione]).map((s) => `[[${s}]]\n`).join('');
    return { rel: `Anagrafica/${nome}.md`, text };
  }

  function creaRilascioTesto(rel, anno) {

/* Avanzamento dello stato del punto di piano: replica di scripts/avanza_stato.py (golden `stato`).

(function (LV) {
  'use strict';
  const ORDINE = ['Da Avviare', 'Bozza', 'Startup', 'Analisi', 'In corso', 'In Verifica', 'Collaudo', 'Concluso'];
  const RINOMINATO = 'Rinominato';
  const rango = (s) => ORDINE.indexOf((s || '').trim());

  const pieno = (v) => !!(v || '').trim();

  function suggerisci(fm, riunioni, oggiIso) {
    const fasi = (riunioni || []).map((r) => [((r.fase || '')).trim().toLowerCase(), !!r.inviato]);
    const g = (k) => fm[k] || '';
    if (dataPassata(g('data_rilascio_effettiva'), oggiIso) || pieno(g('protocollo_estensione_esercizio')) || vero(g('estensione_esercizio_protocollata'))) return 'Concluso';
    if (dataPassata(g('data_collaudo_effettiva'), oggiIso) || pieno(g('protocollo_collaudo')) || fasi.some(([f, inv]) => f.startsWith('collaudo') && inv)

    if (pieno(g('protocollo_disponibilita_collaudo')) || pieno(g('data_disponibilita_collaudo')) || fasi.some(([f]) => f.startsWith('collaudo'))) return 'In Verifica';
    if (fasi.some(([f]) => f.startsWith('sal')) || pieno(g('protocollo_analisi')) || pieno(g('protocollo_approvazione_analisi'))) return 'In corso';
    if (fasi.some(([f]) => f.includes('analisi'))) return 'Analisi';
    if (fasi.some(([f]) => f.startsWith('startup'))) return 'Startup';
    return null;
  }

  function avanza(fm, riunioni, oggiIso) {   // nuovo stato da scrivere, o null
    const stato = (fm.stato || '').trim();
    if (stato === RINOMINATO || vero(fm.stato_manuale)) return null;
    const s = suggerisci(fm, riunioni, oggiIso);

    return { da: r.stato || '', a: s, manuale: vero(fm.stato_manuale) };
  }

      if (m && !idx.piani[+m[1]]) idx.piani[+m[1]] = { anno: +m[1], rilasci: {} };
    }
    const inCartella = (dir) => rels.filter((r) => r.startsWith(dir + '/'));
    for (const rel of rels) {
      const f = files[rel];
      if (!rel.endsWith('.md') || f.text === null || escluso(rel)) continue;
      const nota = MO.parseNota(rel, f.text, f.lastModified);
      idx.note[nota.id] = nota;
      for (const chiave of [LV.md.normalizza(nota.titolo), LV.md.normalizza(MO.stemDi(rel))]) if (!(chiave in idx.perNome)) idx.perNome[chiave] = nota.id;   // index._per_titolo: la prima nota vince
      const anno = PIANO_RE.exec(rel.split('/')[0]);
      if (!anno || nota.tipo !== 'rilascio') continue;
      const dir = MO.cartella(rel);
      const resoconti = inCartella(dir)
        .filter((r) => { const resto = r.slice(dir.length + 1); return RESOCONTO_GLOB.test(resto) && (!resto.includes('/') || (resto.startsWith('inviati/') && resto.split('/').length === 2)); })
        .map((r) => MO.parseResoconto(r, files[r].text || '', {
          haDocx: r.replace(/\.md$/, '.docx') in files, haMsg: r.replace(/\.md$/, '.msg') in files, haPdf: r.replace(/\.md$/, '.pdf') in files }));
      const verbali = inCartella(dir).filter((r) => { const resto = r.slice(dir.length + 1); return !resto.includes('/') && VERBALE_GLOB.test(resto); });
      const r = MO.parseRilascio(rel, f.text, f.lastModified, resoconti, verbali);
      idx.piani[+anno[1]].rilasci[r.codice] = r;
    }
    idx.anni = Object.keys(idx.piani).map(Number).sort((a, b) => b - a);
    return idx;
  }

  // ---- accesso alla cartella -------------------------------------------------------------
  // Handle dell'ultima cartella aperta, memorizzato in IndexedDB (web 1.5.0). Le pagine file:// condividono l'origine:
  // la chiave è il percorso di QUESTA copia di leviathadm.html, così ogni copia ricorda il proprio vault e "Riapri"
  // non mostra mai il vault aperto da un'altra copia. Il permesso readwrite viene richiesto di nuovo al clic su Riapri.
  const DB = 'leviathadm', STORE = 'handles', CHIAVE_HANDLE = location.pathname || 'vault';
  function db() {
    return new Promise((ok, ko) => {
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => ok(req.result);
      req.onerror = () => ko(req.error);
    });
  }
  async function salvaHandle(h) {
    const d = await db();
    await new Promise((ok, ko) => { const t = d.transaction(STORE, 'readwrite'); t.objectStore(STORE).put(h, CHIAVE_HANDLE); t.oncomplete = ok; t.onerror = () => ko(t.error); });
  }
  async function leggiHandle() {
    const d = await db();
    return new Promise((ok, ko) => { const r = d.transaction(STORE).objectStore(STORE).get(CHIAVE_HANDLE); r.onsuccess = () => ok(r.result || null); r.onerror = () => ko(r.error); });
  }
  async function dimenticaCartella() {
    const d = await db();
    await new Promise((ok, ko) => { const t = d.transaction(STORE, 'readwrite'); t.objectStore(STORE).delete(CHIAVE_HANDLE); t.oncomplete = ok; t.onerror = () => ko(t.error); });
  }
  async function riapri() { const h = await leggiHandle().catch(() => null); if (!h) throw new Error('Nessuna cartella memorizzata per questa copia dell\'app.'); return apriHandle(h); }

  async function leggiTesto(file) {   // UTF-8 con eventuale BOM: text() lo toglie in silenzio, quindi si guardano i byte
    if (typeof file.arrayBuffer !== 'function') return { testo: await file.text(), bom: false };   // handle finti minimi dei test
    const buf = await file.arrayBuffer();
    const u = new Uint8Array(buf);

  }
  async function leggiTutto(dir, prefisso, files, saltati, dirs) {
    dirs[prefisso] = dir;   // handle delle cartelle: servono per creare file nuovi (creaFile)
    for await (const [nome, h] of dir.entries()) {
      const rel = prefisso ? `${prefisso}/${nome}` : nome;
      if (h.kind === 'directory') { if (!ESCLUSE.has(nome) && !nome.startsWith('.')) await leggiTutto(h, rel, files, saltati, dirs); continue; }
      if (!nome.endsWith('.md')) {   // basta il nome (.msg/.pdf); del .docx serve anche la data per "docx superato" (solo metadato, nessuna lettura del contenuto)
        let lm = null;
        if (nome.endsWith('.docx')) { try { lm = (await h.getFile()).lastModified; } catch (e) { lm = null; } }
        files[rel] = { text: null, lastModified: lm, handle: h };
        continue;
      }
      try {
        const file = await h.getFile();
        const { testo: raw, bom } = await leggiTesto(file);     // §3.6: BOM rilevato sui byte (text() lo scarta) e conservato in scrittura
        const n = normalizzaTesto(raw);
        files[rel] = { text: n.text, crlf: n.crlf, bom, lastModified: file.lastModified, handle: h };
      } catch (e) {   // come index._carica su OSError: il file si salta, il resto dell'indice vive

      }
    }

  }
  async function haCartellaPiano(dir) {
    for await (const [nome, h] of dir.entries()) if (h.kind === 'directory' && PIANO_RE.test(nome)) return true;
    return false;
  }
  let handleCorrente = null;
  async function apriHandle(h) {
    if ((await h.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Permesso negato sulla cartella.');
    if (!(await haCartellaPiano(h))) throw new Error(`${MSG_CARTELLA} Aperta: "${h.name}".`);   // prima di leggere qualunque file
    LV.emit('lettura', { stato: 'inizio', nome: h.name });
    const saltati = [], dirs = {};
    const files = await leggiTutto(h, '', {}, saltati, dirs);
    LV.ultimaLettura = { file: Object.keys(files).length, saltati };
    LV.emit('lettura', { stato: 'fine', ...LV.ultimaLettura });
    handleCorrente = h;
    LV.radice = { nome: h.name };
    return apriDaMappa(files, dirs);
  }
  function apriDaMappa(files, dirs) {
    if (!haPiano(files)) { LV.emit('errore-vault', MSG_CARTELLA); return null; }
    LV.indice = costruisciIndice(files);
    LV.indice.dirs = dirs;    // undefined in memoria (test): le scritture restano nella mappa
    LV.emit('indice', LV.indice);
    return LV.indice;
  }

  // ---- scrittura ---------------------------------------------------------------------------
  class ConflittoModifica extends Error {
    constructor(rel) { super(`${rel}: il file è cambiato sul disco (sync o Obsidian). Ricarica e ripeti la modifica.`); this.rel = rel; }
  }
  let differita = 0, daRifare = false;
  async function inBlocco(fn) {   // operazioni composte: un solo reindicizza alla fine (anche su errore)
    differita += 1;
    try { return await fn(); } finally { differita -= 1; if (!differita && daRifare) { daRifare = false; reindicizza(); } }
  }
  function reindicizza() {
    if (differita) { daRifare = true; return; }
    const dirs = LV.indice?.dirs;
    LV.indice = costruisciIndice(LV.indice.files);
    LV.indice.dirs = dirs;
    LV.emit('indice-aggiornato', LV.indice);   // non 'indice': la shell non deve rinavigare (perderebbe un modulo compilato)
  }
  async function cartellaSeEsiste(relDir) {  // handle della cartella se esiste sul disco, altrimenti null (niente creazioni)
    const dirs = LV.indice.dirs;
    if (dirs[relDir]) return dirs[relDir];
    let h = dirs[''], acc = '';
    for (const p of relDir.split('/').filter(Boolean)) {
      acc = acc ? `${acc}/${p}` : p;
      if (!dirs[acc]) { try { dirs[acc] = await h.getDirectoryHandle(p); } catch (e) { if (e.name === 'NotFoundError') return null; throw e; } }
      h = dirs[acc];
    }
    return h;
  }
  async function cartellaPer(relDir) {       // handle della cartella (creandola se manca), a partire dalla root
    const dirs = LV.indice.dirs;
    if (dirs[relDir]) return dirs[relDir];
    let h = dirs[''], acc = '';
    for (const p of relDir.split('/').filter(Boolean)) {
      acc = acc ? `${acc}/${p}` : p;
      h = dirs[acc] || await h.getDirectoryHandle(p, { create: true });
      dirs[acc] = h;
    }
    return h;
  }
  async function scriviSuHandle(handle, text, crlf, bom = false) {
    const w = await handle.createWritable();
    await w.write((bom ? '\ufeff' : '') + (crlf ? text.replace(/\r?\n/g, '\r\n') : text));
    await w.close();
  }
  async function scriviFile(rel, text, attesoLastModified) {
    const f = LV.indice.files[rel];
    if (!f) throw new Error(`File non in indice: ${rel}`);
    if (f.handle) {
      const suDisco = await f.handle.getFile().catch(() => null);   // guardia: il disco deve essere quello letto
      if (!suDisco || suDisco.lastModified !== attesoLastModified) throw new ConflittoModifica(rel);
      const testoDisco = await leggiTesto(suDisco).catch(() => null);   // anche il testo: due scritture nello stesso millisecondo
      if (testoDisco === null || normalizzaTesto(testoDisco.testo).text !== f.text) throw new ConflittoModifica(rel);
      await scriviSuHandle(f.handle, text, !!f.crlf, !!f.bom);
      const dopo = await f.handle.getFile();
      Object.assign(f, { text, lastModified: dopo.lastModified });
    } else {
      if (f.lastModified !== attesoLastModified) throw new ConflittoModifica(rel);
      Object.assign(f, { text, lastModified: Date.now() + Math.random() });
    }
    reindicizza();
  }
  async function creaFile(rel, text) {
    // mai sovrascrivere: né un file in indice (anche con maiuscole diverse: NTFS non le distingue),
    // né uno comparso sul disco dopo la lettura (sync, Obsidian) — come crea_file Python (path.exists())
    const giu = rel.toLowerCase();
    if (Object.keys(LV.indice.files).some((k) => k.toLowerCase() === giu)) throw new Error(`Esiste già: ${rel}`);
    const nome = rel.split('/').at(-1), relDir = rel.split('/').slice(0, -1).join('/');
    if (LV.indice.dirs) {
      const d = await cartellaPer(relDir);
      let presente = true;
      try { await d.getFileHandle(nome); } catch (e) { if (e.name !== 'NotFoundError') throw e; presente = false; }
      if (presente) throw new Error(`Esiste già: ${rel} (sul disco, non ancora in indice: ricarica)`);
      const h = await d.getFileHandle(nome, { create: true });
      await scriviSuHandle(h, text, false);    // file nuovi in LF: git li normalizza
      const f = await h.getFile();
      LV.indice.files[rel] = { text, crlf: false, lastModified: f.lastModified, handle: h };
    } else {
      LV.indice.files[rel] = { text, crlf: false, lastModified: Date.now() };
    }
    reindicizza();
  }
  async function spostaFile(relSrc, relDest) {
    const f = LV.indice.files[relSrc];
    if (!f) throw new Error(`File non in indice: ${relSrc}`);
    if (LV.indice.files[relDest]) throw new Error(`Esiste già: ${relDest}`);
    const nome = relDest.split('/').at(-1), relDir = relDest.split('/').slice(0, -1).join('/');
    if (LV.indice.dirs) {
      const d = await cartellaPer(relDir);
      let presente = true;
      try { await d.getFileHandle(nome); } catch (e) { if (e.name !== 'NotFoundError') throw e; presente = false; }
      if (presente) throw new Error(`Esiste già: ${relDest} (sul disco)`);
      const src = await f.handle.getFile();
      if (f.text !== null && src.lastModified !== f.lastModified) throw new ConflittoModifica(relSrc);   // guardia: mai spostare un testo diverso da quello letto
      const bytes = await src.arrayBuffer();          // byte per byte: vale anche per .docx/.pdf
      const h = await d.getFileHandle(nome, { create: true });
      const w = await h.createWritable(); await w.write(bytes); await w.close();
      const srcDir = LV.indice.dirs[relSrc.split('/').slice(0, -1).join('/')];
      try { await srcDir.removeEntry(relSrc.split('/').at(-1)); }
      catch (e) { await d.removeEntry(nome).catch(() => {}); throw e; }   // sorgente bloccata (Word/Outlook): via la copia appena scritta, altrimenti resta orfana e blocca il retry
      const nuovo = await h.getFile();
      const n = f.text !== null ? normalizzaTesto(new TextDecoder().decode(bytes)) : null;   // il testo in indice = i byte copiati
      LV.indice.files[relDest] = { ...f, ...(n ? { text: n.text, crlf: n.crlf } : {}), handle: h, lastModified: nuovo.lastModified };
    } else {
      LV.indice.files[relDest] = { ...f, lastModified: Date.now() + Math.random() };
    }
    delete LV.indice.files[relSrc];
    reindicizza();
  }
  async function eliminaFile(rel) {
    const f = LV.indice.files[rel];
    if (!f) return;
    if (LV.indice.dirs) await LV.indice.dirs[rel.split('/').slice(0, -1).join('/')].removeEntry(rel.split('/').at(-1));
    delete LV.indice.files[rel];
    reindicizza();
  }
  async function preflightMosse(sorgenti, destDir, altriRel, dove = 'in inviati/') {   // §3.3: collisioni (indice + disco) e file cambiati, prima di spostare qualunque cosa
    const giu = new Set(Object.keys(LV.indice.files).map((k) => k.toLowerCase()));
    const nomi = sorgenti.map((k) => k.split('/').at(-1));
    const collisioni = nomi.filter((n) => giu.has(`${destDir}/${n}`.toLowerCase()));
    if (LV.indice.dirs) {
      const d = await cartellaSeEsiste(destDir);   // non crea inviati/ se poi rifiuta
      for (const n of nomi) { if (collisioni.includes(n) || !d) continue; try { await d.getFileHandle(n); collisioni.push(n); } catch (e) { if (e.name !== 'NotFoundError') throw e; } }
      for (const k of [...sorgenti, ...altriRel]) {
        const f = LV.indice.files[k];
        if (!f || f.text === null) continue;
        const suDisco = await f.handle.getFile().catch(() => null);
        if (!suDisco || suDisco.lastModified !== f.lastModified) throw new ConflittoModifica(k);

    if (collisioni.length) throw new Error(`già presenti ${dove}: ${collisioni.join(', ')}`);

  function parziale(msg) { const e = new Error(`${msg} — file già spostati: verifica la cartella del rilascio`); e.parziale = true; return e; }
  async function spostaConRollback(coppie) {   // [[src, dest], …] in ordine; su errore rimette a posto quanto già spostato (come writers.riporta_in_bozza)
    const fatte = [];
    try { for (const [k, dest] of coppie) { await spostaFile(k, dest); fatte.push([k, dest]); } }
    catch (e) {
      const falliti = [];
      for (const [k, dest] of fatte.reverse()) await spostaFile(dest, k).catch((x) => falliti.push(`${dest.split('/').at(-1)} (${x.message})`));
      if (!falliti.length) throw e;

    }
  }
  const riportaInBozza = (res, scheda) => inBlocco(() => _riportaInBozza(res, scheda));
  async function _riportaInBozza(res, scheda) {
    // regola CLAUDE.md "Rettifica" (writers.riporta_in_bozza): file fuori da inviati/, .msg eliminato,
    // inviato: false, scadenza vuota, ❌ nella scheda. Prima si verificano tutte le collisioni, poi si sposta.
    const parti = res.rel.split('/');
    if (parti.at(-2) !== 'inviati') throw new Error(`${parti.at(-1)} non è in inviati/`);
    const dirInv = parti.slice(0, -1).join('/'), dirDest = parti.slice(0, -2).join('/');
    const stem = res.stem;
    const files = Object.keys(LV.indice.files).filter((k) => k.startsWith(`${dirInv}/${stem}.`) && !k.endsWith('.msg'));
    await preflightMosse(files, dirDest, [scheda.rel], 'nella cartella del rilascio');
    files.sort((a, b) => (a.endsWith('.md') ? 1 : 0) - (b.endsWith('.md') ? 1 : 0));   // il .md per ultimo
    await spostaConRollback(files.map((k) => [k, `${dirDest}/${k.split('/').at(-1)}`]));
    const nuovo = `${dirDest}/${stem}.md`;
    const f = LV.indice.files[nuovo];
    try {
      await scriviFile(nuovo, LV.md.updateFrontmatterKeys(f.text, { inviato: 'false', data_scadenza_approvazione: '' }), f.lastModified);
      const s = LV.indice.files[scheda.rel];
      const testoScheda = LV.sk.setRiunioneInviata(s.text, stem, false);
      if (testoScheda !== s.text) await scriviFile(scheda.rel, testoScheda, s.lastModified);
    } catch (e) { throw parziale(e.message); }
    const avvisi = [];
    const msg = `${dirInv}/${stem}.msg`;   // la mail già inviata: per ultima, e se bloccata resta solo un avviso
    if (LV.indice.files[msg]) { try { await eliminaFile(msg); } catch (e) { avvisi.push(`${stem}.msg non eliminato (${e.message}): cancellalo a mano, altrimenti il sync non rigenera la mail`); } }
    return { nuovo, avvisi };
  }
  const segnaInviato = (res, scheda, oggiIso) => inBlocco(() => _segnaInviato(res, scheda, oggiIso));

  // ---- derivati binari: .docx dal template (fase 5) ----------------------------------------
  async function leggiBinario(rel) {   // byte di un file non-.md: dal disco, o dalla mappa in memoria (bytes: Uint8Array o base64)
    const f = LV.indice.files[rel];
    if (!f) throw new Error(`File non in indice: ${rel}`);
    if (f.handle) return new Uint8Array(await (await f.handle.getFile()).arrayBuffer());
    if (f.bytes instanceof Uint8Array) return f.bytes;
    if (typeof f.bytes === 'string') return Uint8Array.from(atob(f.bytes), (c) => c.charCodeAt(0));
    throw new Error(`Contenuto non disponibile: ${rel}`);
  }
  async function scriviBinario(rel, bytes) {   // crea o sovrascrive un file binario (.docx/.eml); nessuna guardia: i derivati si rigenerano
    const nome = rel.split('/').at(-1), relDir = rel.split('/').slice(0, -1).join('/');
    const f = LV.indice.files[rel];
    if (LV.indice.dirs) {
      const h = f?.handle || await (await cartellaPer(relDir)).getFileHandle(nome, { create: true });
      const w = await h.createWritable(); await w.write(bytes); await w.close();
      const dopo = await h.getFile();
      LV.indice.files[rel] = { text: null, lastModified: dopo.lastModified, handle: h };
    } else {
      LV.indice.files[rel] = { text: null, bytes, lastModified: Date.now() + Math.random() };
    }
    reindicizza();
  }
  const ddmmyyyy = (iso) => `${iso.slice(8)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
  const rigeneraDocx = (res) => inBlocco(() => _rigeneraDocx(res));
  async function _rigeneraDocx(res) {   // writers.rigenera_docx / rigenera_resoconto.rigenera: prima il Word, poi il .md, poi via le mail obsolete
    if (!LV.zip.disponibile()) throw new Error('Questo browser non sa comprimere (CompressionStream deflate-raw): serve Edge o Chrome 103 o successivi.');
    const rel = res.rel, parti = rel.split('/');
    if (parti.at(-2) === 'inviati') throw new Error("resoconto già inviato: prima 'Riporta in bozza' (regola di rettifica), poi rigenera");
    const f = LV.indice.files[rel];
    if (!f) throw new Error(`File non in indice: ${rel}`);
    const sez = LV.md.splitSections(LV.md.splitBody(f.text));
    if (!('RIUNIONE' in sez) || !('OBIETTIVO' in sez)) throw new Error('resoconto senza le sezioni ## RIUNIONE/OBIETTIVO (export docx2md?): il .docx generato sarebbe vuoto');
    const data = LV.docx.datiDaMd(f.text);
    const oggi = LV.cruscotto.oggi();
    data.data_compilazione = ddmmyyyy(oggi);
    const relTpl = `Template/${LV.docx.nomeTemplate(data)}`;
    if (!(relTpl in LV.indice.files)) throw new Error(`template assente nel vault: ${relTpl}`);
    const bytes = await LV.docx.riempi(await leggiBinario(relTpl), data);
    await controllaInvariato(rel, f.lastModified);   // guardia PRIMA del Word: mai un .docx dal testo vecchio sopra un .md cambiato (writers.rigenera_docx: _guardia per prima)
    const relDocx = rel.replace(/\.md$/, '.docx');
    await scriviBinario(relDocx, bytes);   // prima il Word: se la scrittura fallisce (file aperto) il .md resta com'era
    const testo = f.text.replace(/^data_compilazione:.*$/m, `data_compilazione: ${oggi}`)
      .replace(/(\|\s*\*\*DATA COMPILAZIONE\*\*\s*\|\s*).*?(\s*\|)/, (m, a, b) => a + ddmmyyyy(oggi) + b);
    await scriviFile(rel, testo, f.lastModified);
    let mailEliminata = false;
    for (const e of ['.msg', '.eml']) {
      const k = rel.replace(/\.md$/, e);
      if (!(k in LV.indice.files)) continue;
      try { await eliminaFile(k); mailEliminata = true; }
      catch (x) { throw parziale(`Word e .md rigenerati, ma ${k.split('/').at(-1)} non si è potuto eliminare (${x.message}): chiudilo in Outlook, cancellalo e poi "Genera mail"`); }
    }
    return { docx: relDocx, mailEliminata };
  }
  async function controllaInvariato(rel, attesoLastModified) {   // la guardia di scriviFile, da sola: disco = quanto letto (data e testo)
    const f = LV.indice.files[rel];
    if (!f.handle) { if (f.lastModified !== attesoLastModified) throw new ConflittoModifica(rel); return; }
    const suDisco = await f.handle.getFile().catch(() => null);
    if (!suDisco || suDisco.lastModified !== attesoLastModified) throw new ConflittoModifica(rel);
    const testoDisco = await leggiTesto(suDisco).catch(() => null);
    if (testoDisco === null || normalizzaTesto(testoDisco.testo).text !== f.text) throw new ConflittoModifica(rel);
  }

  // ---- bozze mail .eml (genera_mail_resoconto.genera_eml, chiudi_approvazione: parte senza Word/Outlook) ----
  const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const dirRilascioDi = (rel) => rel.split('/').slice(0, -1).join('/').replace(/\/inviati$/, '');

    const dir = dirRilascioDi(res.rel), n = dir.split('/').length + 1;

    if (!f || f.text === null || /^email:[ \t]*\S/m.test(f.text)) return false;   // [ \t], non \s: il Python con \s inghiotte l'a capo e non completa mai (bug, non replicato)
    const nuovo = f.text.replace(/^email:[ \t]*$/m, `email: ${email}`);

/* === 38_trascritti.js === */
/* Trascritti di riunione → markdown: .vtt (traduzione di scripts/vtt2md.py) e .docx (lettore Word in JS:
   stesso testo del docx2md di pandoc — speaker in grassetto, timestamp, hard break — non byte-identico). */
window.LV = window.LV || {};
(function (LV) {
  'use strict';
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

  function vttToMd(testo, stem) {
    const cues = [];
    for (const m of testo.matchAll(/(\d{2}):(\d{2}):(\d{2})\.\d+\s*-->.*?\n<v ([^>]+)>(.*?)<\/v>/gs)) {
      const [, h, mi, s, speaker, battuta] = m;
      const start = `${+h * 60 + +mi}:${s}`, chi = speaker.trim(), txt = battuta.split(/\s+/).filter(Boolean).join(' ');
      if (cues.length && cues.at(-1).chi === chi) cues.at(-1).txt += ' ' + txt;
      else cues.push({ chi, start, txt });
    }
    const righe = [`**${stem}** (da sottotitoli VTT)`, '', `Durata circa ${cues.length ? cues.at(-1).start : '?'}`, ''];
    for (const c of cues) righe.push(`**${c.chi}** ${c.start}\\`, c.txt, '');
    return righe.join('\n');
  }

  const figli = (el, nome) => Array.from(el.childNodes).filter((n) => n.nodeType === 1 && n.localName === nome && n.namespaceURI === W);
  function grassetto(run) {
    const rPr = figli(run, 'rPr')[0];
    const b = rPr && figli(rPr, 'b')[0];
    if (!b) return false;
    const val = b.getAttributeNS(W, 'val') || b.getAttribute('w:val');
    return !(val === '0' || val === 'false');
  }
  function testoParagrafo(p) {   // segmenti [testo, bold] → i gruppi contigui in grassetto diventano **…**
    const seg = [];
    for (const r of Array.from(p.getElementsByTagNameNS(W, 'r'))) {
      const bold = grassetto(r);
      for (const n of Array.from(r.childNodes)) {
        if (n.nodeType !== 1 || n.namespaceURI !== W) continue;
        if (n.localName === 't') seg.push([n.textContent, bold]);
        else if (n.localName === 'tab') seg.push([' ', false]);
        else if (n.localName === 'br') seg.push(['\\\n', false]);
      }
    }
    let out = '', i = 0;
    while (i < seg.length) {
      if (!seg[i][1]) { out += seg[i][0]; i++; continue; }
      let j = i, t = '';
      while (j < seg.length && seg[j][1]) t += seg[j++][0];
      const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(t);   // spazi di bordo fuori dai **: Teams scrive `NOME   ` in grassetto, e `**NOME   **` non è markdown valido
      out += m[2] ? `${m[1]}**${m[2]}**${m[3]}` : t;
      i = j;
    }
    return out.replace(/^(\\\n)+/, '');   // hard break in testa al paragrafo: riga con solo `\`, rumore
  }
  const testoCella = (tc) => figli(tc, 'p').map(testoParagrafo).join(' ').replace(/\\\n/g, ' ').replace(/\s+/g, ' ').trim();
  function testoTabella(tbl) {
    return figli(tbl, 'tr').map((tr) => `| ${figli(tr, 'tc').map(testoCella).join(' | ')} |`).join('\n');
  }
  async function docxToMd(bytes) {
    if (!LV.zip.disponibile()) throw new Error('DecompressionStream assente: serve Edge o Chrome 103 o successivi');
    const voci = await LV.zip.leggi(bytes);
    const doc = voci.find((v) => v.nome === 'word/document.xml');
    if (!doc) throw new Error('document.xml assente: non è un file Word');
    const xml = new DOMParser().parseFromString(new TextDecoder().decode(doc.dati), 'application/xml');
    if (xml.getElementsByTagName('parsererror').length) throw new Error('document.xml non leggibile');
    const body = xml.getElementsByTagNameNS(W, 'body')[0];
    if (!body) throw new Error('document.xml senza w:body');
    const blocchi = [];
    for (const el of Array.from(body.childNodes)) {
      if (el.nodeType !== 1 || el.namespaceURI !== W) continue;
      if (el.localName === 'p') blocchi.push(testoParagrafo(el));
      else if (el.localName === 'tbl') blocchi.push(testoTabella(el));
    }
    return blocchi.filter((b) => b.trim()).join('\n\n') + '\n';   // paragrafi vuoti: al più una riga vuota fra i blocchi (come pandoc)
  }
  const nomeMd = (nomeFile) => nomeFile.replace(/\.(docx|vtt)$/i, '') + '.md';
  LV.trascritti = { vttToMd, docxToMd, nomeMd };
})(window.LV);

/* === 39_fonti.js === */
/* Carica fonti: traduzione di leviathadm/vault/fonti.py + ui/pages/carica_fonti.processa — salvataggio in
   _fonti/<AAAAMMGG> <Fase>/, conversione dei trascritti, presenze → Anagrafica, riga Riunioni; un messaggio per esito. */
window.LV = window.LV || {};
(function (LV) {
  'use strict';
  const ESTENSIONI = new Set(['.docx', '.md', '.vtt', '.csv', '.pdf']);
  const MAX_BYTES = 200 * 1024 * 1024;
  const estensione = (nome) => { const i = nome.lastIndexOf('.'); return i < 0 ? '' : nome.slice(i).toLowerCase(); };
  const basename = (nome) => (nome || '').split(/[\\/]/).at(-1);
  const cartella = (dirRilascio, dataIso, faseTab) => `${dirRilascio}/_fonti/${dataIso.replaceAll('-', '')} ${faseTab}`;
  const decodificaMd = (bytes) => LV.vault.normalizzaTesto(new TextDecoder().decode(bytes)).text;   // BOM tolto, CRLF → LF (come l'indice)
  const stessiByte = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

  async function salva(dirRilascio, dataIso, faseTab, nome, bytes, { sovrascrivi = false } = {}) {
    nome = basename(nome);
    const ext = estensione(nome);
    if (!ESTENSIONI.has(ext)) return { stato: 'rifiutato', rel: null, messaggio: `estensione non ammessa: ${nome}` };
    if (bytes.length > MAX_BYTES) return { stato: 'rifiutato', rel: null, messaggio: `file troppo grande (> ${MAX_BYTES / 2 ** 20} MB): ${nome}` };
    const rel = `${cartella(dirRilascio, dataIso, faseTab)}/${nome}`;
    let esistente = LV.indice.files[rel];
    if (!esistente && await LV.vault.adottaDalDisco(rel)) esistente = LV.indice.files[rel];   // comparso sul disco dopo l'apertura: conflitto, non sovrascrittura silenziosa
    if (esistente) {
      const uguale = ext === '.md' ? esistente.text === decodificaMd(bytes) : stessiByte(await LV.vault.leggiBinario(rel), bytes);
      if (uguale) return { stato: 'identico', rel, messaggio: '' };
      if (!sovrascrivi) return { stato: 'conflitto', rel, messaggio: `${nome} esiste già con contenuto diverso` };
    }
    if (ext === '.md') {
      if (esistente) await LV.vault.scriviFile(rel, decodificaMd(bytes), esistente.lastModified);
      else await LV.vault.creaFile(rel, decodificaMd(bytes));
    } else await LV.vault.scriviBinario(rel, bytes);
    return { stato: 'salvato', rel, messaggio: '' };
  }

  async function scriviMd(rel, testo) {   // il .md gemello del trascritto: copia di lavoro, sovrascritta
    const f = LV.indice.files[rel];
    if (f && f.text !== null) await LV.vault.scriviFile(rel, testo, f.lastModified); else await LV.vault.creaFile(rel, testo);
  }
  async function converti(rel, nome, bytes) {   // → nome del .md oppure Error
    const ext = estensione(nome);
    if (ext === '.md') return nome;
    const testo = ext === '.vtt' ? LV.trascritti.vttToMd(new TextDecoder().decode(bytes), nome.slice(0, -4)) : await LV.trascritti.docxToMd(bytes);
    const relMd = rel.slice(0, rel.length - nome.length) + LV.trascritti.nomeMd(nome);
    await scriviMd(relMd, testo);

  }
  function resocontoBozzaPer(dirRilascio, dataIso, faseTab) {   // il resoconto di quella riunione nella radice del rilascio, se esiste
    const etichetta = faseTab.replace('SAL #', 'SAL ');
    const codice = dirRilascio.split('/').at(-1);
    const r = LV.vault.rilascioPerCartella(dirRilascio);
    const rel = `${dirRilascio}/${LV.sk.nomeFile(r ? r.codice : codice, etichetta, dataIso)}`;
    return LV.indice.files[rel] ? rel : null;
  }

  async function carica({ dirRilascio, schedaRel, dataIso, faseTab, files, sovrascrivi = new Set() }) {
    return LV.vault.inBlocco(async () => {
      const out = { messaggi: [], conflitti: [], trascritto: null, presenze: null, resocontoBozza: null };
      for (const { nome: nomeGrezzo, bytes } of files) {
        const nome = basename(nomeGrezzo);
        let e;
        try { e = await salva(dirRilascio, dataIso, faseTab, nome, bytes, { sovrascrivi: sovrascrivi.has(nome) }); }
        catch (err) { out.messaggi.push(`${nome}: non salvato (${err.message})`); continue; }
        if (e.stato === 'rifiutato' || e.stato === 'conflitto') {
          out.messaggi.push(`${nome}: ${e.stato} — ${e.messaggio}`);
          if (e.stato === 'conflitto') out.conflitti.push(nome);
          continue;
        }
        out.messaggi.push(`${nome}: ${e.stato}`);
        const ext = estensione(nome);
        if (ext === '.docx' || ext === '.vtt' || ext === '.md') {
          try {
            const md = await converti(e.rel, nome, bytes);
            if (ext !== '.md') out.messaggi.push(`${nome}: convertito in ${md}`);
            out.trascritto = out.trascritto || md;
          } catch (err) { out.messaggi.push(`${nome}: salvato ma non convertito (${err.message}): convertilo a mano`); }
        } else if (ext === '.csv') {
          try {
            const p = LV.presenze.parse(bytes, nome);
            if (!p.adm.length && !p.sogei.length && !p.altri.length) throw new Error('nessun partecipante nella sezione "2. Partecipanti"');
            const a = await LV.anagrafica.aggiornaDaPresenze(p);
            out.messaggi.push(`${nome}: ${p.adm.length} ADM, ${p.sogei.length} SOGEI, ${p.altri.length} altri; stub Anagrafica creati: ${a.created.length}`);
            for (const err of a.errori) out.messaggi.push(`${nome}: ${err}`);
            out.presenze = p;
          } catch (err) { out.messaggi.push(`${nome}: salvato, ma non leggibile come presenze (${err.message})`); }
        }
      }
      if (out.trascritto) {
        try {
          const s = LV.indice.files[schedaRel];
          if (!s || s.text === null) throw new Error('scheda non in indice');
          const nuovo = LV.sk.completaRigaRiunione(s.text, dataIso, faseTab, out.trascritto);
          if (nuovo !== null) {
            await LV.vault.scriviFile(schedaRel, nuovo, s.lastModified);
            out.messaggi.push(`Riga Riunioni ${dataIso} ${faseTab}: trascritto \`${out.trascritto}\``);
            const av = await LV.vault.avanzaStato(schedaRel);
            if (av) out.messaggi.push(`Stato: ${av.da || '(vuoto)'} → ${av.a}`);
          }
        } catch (err) { out.messaggi.push(`Riga Riunioni non aggiornata (${err.message}): aggiungi il trascritto a mano`); }

})(window.LV);

/* === 40_render.js === */
/* Mini-renderer markdown: solo ciò che il vault usa (titoli, paragrafi, elenchi e checkbox, numerati,
   citazioni, hr, tabelle, codice recintato; inline: grassetto, codice, wikilink, link). HTML escapato. */
(function (LV) {
  'use strict';
  const esc = LV.esc;
  LV.render = LV.render || {};
  LV.render.link = (target) => {   // index.risolvi: id esatto, altrimenti titolo/stem normalizzati (mappa costruita con l'indice)
    const t = String(target).split('#')[0].trim();
    const idx = LV.indice;
    const id = idx && (idx.note[t] ? t : idx.perNome[LV.md.normalizza(t)]);
    return `#/nota/${encodeURIComponent(id || t)}`;
  };
  const WIKI = /!?\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g;
  function inlineBase(t) {     // tratto senza wikilink: escape, poi codice, link markdown, grassetto
    let s = esc(t);
    s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  }
  function inline(t) {
    // i wikilink si riconoscono sul testo grezzo: apostrofi e & nei nomi (es. [[Vortice Ali' Biagio]]) non devono
    // passare dall'escape prima della regex (&#39; contiene il # che chiude il target)
    const s = String(t ?? '');
    let out = '', pos = 0;
    for (const m of s.matchAll(WIKI)) {
      out += inlineBase(s.slice(pos, m.index));
      const target = m[1].trim(), alias = (m[2] || '').trim();
      out += `<a class="wiki" href="${LV.render.link(target)}">${esc(alias || target)}</a>`;   // href da encodeURIComponent: niente ", <, >
      pos = m.index + m[0].length;
    }
    return out + inlineBase(s.slice(pos));
  }
  const SEP = /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?$/;
  const celle = (riga) => riga.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const ALTRO = /^(#{1,6} |```|\||>|\s*[-*+] |\s*\d+[.)] )/;
  const HR = /^(-{3,}|\*{3,})\s*$/;

    const righe = (testo || '').replace(/\r\n/g, '\n').split('\n');

    let i = 0;
    const blocco = (cond, wrap) => { const acc = []; while (i < righe.length && cond(righe[i])) acc.push(righe[i++]); return wrap(acc); };
    while (i < righe.length) {
      const r = righe[i];
      if (!r.trim()) { i++; continue; }
      let m;
      if (r.startsWith('```')) { i++; const acc = []; while (i < righe.length && !righe[i].startsWith('```')) acc.push(righe[i++]); i++; out.push(`<pre>${esc(acc.join('\n'))}</pre>`); continue; }
      if ((m = /^(#{1,6}) +(.+?)\s*$/.exec(r))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
      if (HR.test(r)) { out.push('<hr>'); i++; continue; }
      if (r.trim().startsWith('|') && i + 1 < righe.length && SEP.test(righe[i + 1].trim())) {
        const head = celle(r); i += 2; const body = [];
        while (i < righe.length && righe[i].trim().startsWith('|')) body.push(celle(righe[i++]));
        out.push(`<table class="lv"><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map((rw) => `<tr>${rw.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
        continue;
      }
      if (/^\s*[-*+] /.test(r)) { out.push(blocco((x) => /^\s*[-*+] /.test(x), (acc) => `<ul>${acc.map((x) => {
        const t = x.replace(/^\s*[-*+] /, ''); const c = /^\[( |x|X)\] (.*)$/.exec(t);
        return c ? `<li class="task"><input type="checkbox" disabled${c[1] === ' ' ? '' : ' checked'}> ${inline(c[2])}</li>` : `<li>${inline(t)}</li>`; }).join('')}</ul>`)); continue; }
      if (/^\s*\d+[.)] /.test(r)) { out.push(blocco((x) => /^\s*\d+[.)] /.test(x), (acc) => `<ol>${acc.map((x) => `<li>${inline(x.replace(/^\s*\d+[.)] /, ''))}</li>`).join('')}</ol>`)); continue; }
      if (r.startsWith('>')) { out.push(blocco((x) => x.startsWith('>'), (acc) => `<blockquote>${acc.map((x) => inline(x.replace(/^>\s?/, ''))).join('<br>')}</blockquote>`)); continue; }
      const testoLibero = (x) => x.trim() && !ALTRO.test(x) && !HR.test(x);
      if (!testoLibero(r)) { out.push(`<p>${inline(r)}</p>`); i++; continue; }   // riga orfana (es. | senza tabella): paragrafo, mai ciclo infinito
      out.push(blocco(testoLibero, (acc) => `<p>${acc.map(inline).join('<br>')}</p>`));   // a capo nel paragrafo = <br> (come Obsidian)
    }

  }

})(window.LV);

/* === 41_convocazione.js === */
/* Convocazioni (startup e collaudo): traduzione di scripts/genera_convocazione.py, ui/pages/convocazione.py e
   vault/piano_test.py. Funzioni pure, nessun DOM: date proposte, ora, alternative, Piano di Test (Task 1);
   destinatari e corpi (Task 2); .ics e .eml (Task 3); Verbale (Task 4). Il vault entra solo in 30_vault.js. */
window.LV = window.LV || {};
(function (LV) {
  'use strict';
  const K = LV.cruscotto;
  const GIORNI = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];
  const ORA = /^([01]\d|2[0-3]):([0-5]\d)$/;
  const pad2 = (n) => String(n).padStart(2, '0');
  const daIso = (iso) => new Date(`${iso}T00:00:00Z`);                 // UTC come 35_cruscotto: niente salti di ora legale
  const aIso = (d) => `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
  const piuGiorni = (iso, n) => aIso(new Date(daIso(iso).getTime() + n * 86400000));
  const giorniTra = (a, b) => Math.round((daIso(a) - daIso(b)) / 86400000);

  // ---- date (propose_collaudo_date, giorni_lavorativi_dopo, _fmt_giorno) ----
  function proponiDataCollaudo(scadenzaIso, oggiIso, minGap = 3) {
    let cand = null;
    for (const off of [15, 10]) { const c = piuGiorni(scadenzaIso, -off); if (giorniTra(c, oggiIso) >= minGap) { cand = c; break; } }
    if (cand === null) cand = piuGiorni(scadenzaIso, -10);
    while (K.weekday(cand) >= 5) cand = piuGiorni(cand, -1);
    return cand;
  }
  function dataProposta(fm, oggiIso) {   // '' se data_disponibilita_collaudo assente o non leggibile (DA COMPLETARE)
    const disp = LV.md.parseData((fm || {}).data_disponibilita_collaudo || '');
    return disp ? proponiDataCollaudo(piuGiorni(disp, 20), oggiIso) : '';
  }
  const giorniLavorativiDopo = (iso, n) => K.businessDaysAfter(iso, n);
  const ddmmyyyy = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
  const formattaGiorno = (iso) => `${GIORNI[K.weekday(iso)]} ${ddmmyyyy(iso)}`;
  const formattaAlternativa = (iso, ora) => `${GIORNI[K.weekday(iso)]} ${ddmmyyyy(iso)}, ore ${ora.trim()}`;

  // ---- ora (valida_ora / _check_ora) ----
  function validaOra(ora) {
    const m = ORA.exec((ora || '').trim());
    if (!m) return 'ora non valida (HH:MM)';
    const minuti = +m[1] * 60 + +m[2];
    if (12 * 60 + 30 <= minuti && minuti < 14 * 60) return 'niente riunioni tra le 12:30 e le 14:00 (pausa pranzo)';
    return null;
  }

  // ---- alternative (alternative_da_righe): righe vuote saltate, data e ora entrambe obbligatorie ----
  function alternativeDaRighe(righe) {
    const alternative = [];
    for (let i = 0; i < righe.length; i++) {
      const data = (righe[i][0] || '').trim(), ora = (righe[i][1] || '').trim();
      if (!data && !ora) continue;
      const iso = /^\d{4}-\d{2}-\d{2}$/.test(data) ? LV.md.parseData(data) : null;   // date.fromisoformat: solo AAAA-MM-GG

  function tabellaPersone(tbl, nomi) {   // una riga per nome: righe clonate dall'ultima segnaposto, eccedenti rimosse; nomi già "Cognome Nome" (datiLettere)
    const d = D();
    let righe = d.righe(tbl).slice(1);
    if (!righe.length) throw d.nonConforme('tabella dei rappresentanti senza righe segnaposto');
    while (righe.length < nomi.length) { tbl.appendChild(righe[righe.length - 1].cloneNode(true)); righe = d.righe(tbl).slice(1); }
    nomi.forEach((n, i) => { const [cog, nom] = cognomeNome(n); const cs = d.celle(righe[i]); d.setCellText(cs[0], cog); if (cs[1]) d.setCellText(cs[1], nom); });
    for (const tr of righe.slice(nomi.length)) tr.parentNode.removeChild(tr);
  }
  function sostituisciRun(body, mappa) {   // solo il testo dei run che contengono il segnaposto: tab, spazi e stile restano
    const d = D();
    for (const p of d.figli(body, 'p')) for (const r of d.runs(p)) {
      const t = d.runText(r);
      let nuovo = t;
      for (const [vecchio, valore] of Object.entries(mappa)) if (nuovo.includes(vecchio)) nuovo = nuovo.split(vecchio).join(valore);
      if (nuovo !== t) setRunTextConTab(r, nuovo);
    }
  }
  function setRunTextConTab(r, text) {   // come setRunText, ma i \t iniziali tornano w:tab (i paragrafi p.c. del template cominciano con tab)
    const d = D(), doc = r.ownerDocument, W = r.namespaceURI;
    const m = /^(\t*)([\s\S]*)$/.exec(text);
    d.setRunText(r, m[2]);
    const primo = Array.from(r.childNodes).find((n) => n.nodeType === 1 && n.localName === 't') || null;
    for (let i = 0; i < m[1].length; i++) r.insertBefore(doc.createElementNS(W, 'w:tab'), primo);
  }
  function controlla(body) {
    const res = residui(body);
    if (res.length) throw D().nonConforme(`segnaposto non sostituito: ${res.join(' | ').slice(0, 200)}`);
  }
  async function riempiTrasmissione(templateBytes, dati) {
    const d = D(), doc = await d.apriDocumento(templateBytes), body = doc.body;
    tabellaPo(body, dati);
    tabellaPersone(d.tabella(body, 1, 2), dati.adm || []);
    tabellaPersone(d.tabella(body, 2, 2), dati.sogei || []);
    const pEsito = d.figli(body, 'p').find((p) => /esito\s+POSITIVO/.test(d.paraText(p)));
    if (!pEsito) throw d.nonConforme('paragrafo "Il collaudo ha avuto esito POSITIVO" assente');
    const rEsito = d.runs(pEsito).find((r) => d.runText(r).includes('POSITIVO'));
    d.setRunText(rEsito, d.runText(rEsito).replace('POSITIVO', dati.esito || 'POSITIVO'));
    controlla(body);
    return d.chiudiDocumento(doc);
  }
  async function riempiEstensione(templateBytes, dati) {
    const d = D(), doc = await d.apriDocumento(templateBytes), body = doc.body;
    tabellaPo(body, dati);
    sostituisciRun(body, { '[Direzione di business]': dati.direzione || '', '[Ufficio del Responsabile di Business]': dati.ufficio || '', '[Area di Staff]': dati.area_staff || 'Area di Staff' });
    controlla(body);
    return d.chiudiDocumento(doc);
  }

  LV.lettere = { LETTERE, etichetta, nomeFile, cognomeNome, ufficioDaOrganigramma, direzioneDaSigla, esitoDaResoconto, datiLettere, datiLettereConCsv,
                 residui, riempiTrasmissione, riempiEstensione, AVVISO_DENOMINAZIONE, AVVISO_RB, AVVISO_EFFETTIVA };
})(window.LV);

/* Tabella dei rilasci del piano corrente: ordinamento per colonna (stato per ciclo di vita), filtro testo, filtro stati. */
(function (LV) {
  'use strict';
  const esc = LV.esc, ui = LV.ui;
  const COL = [['n', '#'], ['codice', 'Codice'], ['descrizione', 'Rilascio'], ['stato', 'Stato'], ['pm', 'PM'], ['collaudo', 'Collaudo prev./eff.'], ['prossima', 'Prossima riunione']];
  const LARGH = { n: 5, codice: 17, descrizione: 25, stato: 9, pm: 13, collaudo: 15, prossima: 16 };
  let ordine = { col: 'codice', asc: true }, filtroTesto = '', filtroStati = new Set();
  const righeDi = (piano) => Object.values(piano.rilasci).sort((a, b) => a.codice.localeCompare(b.codice)).map((r, i) => ({
    n: i + 1, codice: r.codice, descrizione: r.descrizione_rilascio, stato: r.stato, stato_ord: ui.rangoStato(r.stato), pm: r.frontmatter.pm || '',
    collaudo: `${ui.fmtData(r.frontmatter.data_collaudo_prevista)} / ${ui.fmtData(r.frontmatter.data_collaudo_effettiva)}`,
    collaudo_ord: LV.md.parseData(r.frontmatter.data_collaudo_prevista) || '', prossima: r.prossima_riunione, attivo: r.attivo }));
  function ordina(righe) {
    const { col, asc } = ordine;
    const k = (r) => col === 'stato' ? r.stato_ord : col === 'collaudo' ? r.collaudo_ord : col === 'n' ? r.n : String(r[col]).toLowerCase();
    return [...righe].sort((a, b) => { const x = k(a), y = k(b); return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1); });
  }
  function filtra(righe) {
    const t = filtroTesto.trim().toLowerCase();
    return righe.filter((r) => (!filtroStati.size || filtroStati.has(r.stato)) && (!t || COL.map(([c]) => String(r[c])).join(' ').toLowerCase().includes(t)));   // solo le colonne visibili
  }
  ui.rotte[''] = function (main) {
