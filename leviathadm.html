      const vp = r.verbali.at(-1), v = LV.verb.parseVerbale(vp, LV.indice.files[vp].text, 0);
      leggiCasi();
      const nuovo = LV.verb.riallineaEsitoDaVerbale({ ...doc.esito, casi }, v);
      casi = nuovo.casi; renderCasi();
      if (nuovo.esito) form.querySelector('[name="esito"]').value = nuovo.esito;
      if (nuovo.casi.some((c) => !c.esito)) ui.toast('Alcune verifiche del Verbale non hanno ancora esito.', 'avviso');
    };
    const chSel = form.querySelector('[name="chiusura-sel"]');
    if (chSel) chSel.onchange = () => { form.querySelector('[name="chiusura-testo"]').hidden = chSel.value !== '__altro__'; };
    const kv = (heading) => Object.fromEntries(Array.from(form.querySelectorAll(`[name^="${heading}::"]`)).map((el) => [el.name.slice(heading.length + 2), (el.value || '').trim()]));
    const nuoviInner = () => {
      leggiAdm(); leggiAzioni(); leggiCasi();
      const out = {};
      for (const s of doc.sezioni) {
        const hd = s.heading;
        if (s.grezza || !R.SEZIONI_NOTE.includes(hd) || R.SEZIONI_TESTO.includes(hd)) out[hd] = stripNl(form.querySelector(`textarea[name="${CSS.escape(hd)}"]`).value);
        else if (R.SEZIONI_KV.includes(hd)) out[hd] = R.serKv(kv(hd));
        else if (hd === 'LISTA PARTECIPANTI') out[hd] = R.serPartecipanti(adm.filter((p) => p.nome.trim()), sogei.filter((x) => x.trim()), form.querySelector('[name="nota-partecipanti"]').value.trim());
        else if (hd === 'AZIONI CONCORDATE') out[hd] = R.serAzioni(azioni.filter((a) => a.trim()));
        else if (hd === 'ESITO') {
          const chiusura = chSel.value === '__altro__' ? stripNl(form.querySelector('[name="chiusura-testo"]').value) : chSel.value;
          out[hd] = R.serEsito({ intro: doc.esito.intro, casi: casi.filter((c) => c.nome), osservazioni: stripNl(form.querySelector('[name="osservazioni"]').value), esito: form.querySelector('[name="esito"]').value, chiusura });
        }
      }
      return out;
    };
    form.querySelector('.annulla').onclick = annulla;
    const btnSalva = form.querySelector('.salva');
    btnSalva.onclick = () => ui.conBottone(btnSalva, async () => {
      const nuovi = nuoviInner();
      const hNew = form.querySelector('[name="nuova-sezione-titolo"]').value.trim().toUpperCase();
      if (hNew) { if (hNew in nuovi) return ui.toast(`La sezione ${hNew} esiste già.`, 'avviso'); nuovi[hNew] = stripNl(form.querySelector('[name="nuova-sezione-testo"]').value); }
      const bodies = R.bodiesModificati(doc, nuovi);
      const fmMod = {};
      const dataEl = form.querySelector('[name="RIUNIONE::DATA"]');
      if (dataEl) {
        const v = dataEl.value.trim();
        if (v !== (doc.riunione.DATA || '') && !/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return ui.toast('Data riunione non valida: usa GG/MM/AAAA.', 'avviso');
        const iso = LV.md.parseData(v);
        if (iso && iso !== (doc.frontmatter.data_riunione || '')) fmMod.data_riunione = iso;
      }
      if (doc.sezioni.some((s) => s.heading === 'RESOCONTO' && !s.grezza)) {
        const { mod, errore } = R.campiFrontmatterResoconto(R.parseKv(nuovi.RESOCONTO) || {}, doc.resoconto);
        if (errore) return ui.toast(errore, 'avviso');
        if (mod.data_approvazione) ui.toast('Attenzione: con "Data approvazione" compilata il resoconto esce dalla convalida tacita (scadenze e definitivo automatici).', 'avviso', true);
        Object.assign(fmMod, mod);
      }
      if (!Object.keys(bodies).length && !Object.keys(fmMod).length) return ui.toast('Nessuna modifica da salvare.');
      const fFile = LV.indice.files[n.rel];
      let testo = Object.keys(bodies).length ? LV.sk.salvaSezioni(fFile.text, bodies) : fFile.text;
      if (Object.keys(fmMod).length) testo = LV.md.updateFrontmatterKeys(testo, fmMod);
      try { await LV.vault.scriviFile(n.rel, testo, doc.lastModified); }
      catch (e) {
        ui.toast(e.message, 'errore', true);
        if (e instanceof LV.vault.ConflittoModifica) ui.pulsanteRicarica(form, n.rel, () => { const ff = LV.indice.files[n.rel]; doc = R.parseResocontoDoc(n.rel, ff.text, ff.lastModified); });
        return;
      }
      ui.toast(`Salvato: ${Object.keys(bodies).concat(Object.keys(fmMod)).join(', ')}.`, 'ok');
      if (Object.keys(bodies).length && ['.docx', '.msg'].some((x) => n.rel.replace(/\.md$/, x) in LV.indice.files)) ui.toast('Il .docx e il .msg esistenti sono ora superati: usa "Rigenera .docx" e poi "Genera mail" qui sotto (Bozze da inviare li segnala con ⚠️).', 'avviso', true);
      dopoSalva(nid);
    });
  };

  ui.formNuovoResoconto = function (container, r, { dopo }) {
    const fasi = r.riunioni.map((m) => m.fase);
    const ammesse = LV.sk.fasiAmmesse(fasi);
    const FASI_FONTI = ['Startup', 'Prima Analisi', 'SAL', 'Collaudo'];
    const oggi = LV.cruscotto.oggi();   // data locale
    container.innerHTML = `<form class="nuovo-resoconto card" onsubmit="return false"><b>Nuova riunione</b>
      <p class="muted">Lo scheletro nasce già compilato da scheda e Anagrafica (team della scheda: lista da integrare con il report presenze); restano da scrivere ARGOMENTI TRATTATI e AZIONI CONCORDATE.</p>
      <div class="griglia-form">
        <label class="campo"><span class="muted">Fase (o testo libero)</span><input name="fase" list="lv-fasi" value="${ammesse.includes('SAL') ? 'SAL' : esc(ammesse[0])}" autocomplete="off"><datalist id="lv-fasi">${ammesse.map((f) => `<option value="${esc(f)}">`).join('')}</datalist></label>
        <label class="campo"><span class="muted">Numero SAL</span><input name="n_sal" type="number" min="1" value="${LV.sk.prossimoSal(fasi)}"></label>
        ${ui.campoData('data', 'Data riunione', oggi, { weekend: true })}
        <label class="campo"><span class="muted">Variante collaudo</span><select name="variante"><option value="">—</option><option value="firma">Approvazione con firma (sezione FIRME nel Word)</option><option value="telematica">Approvazione telematica, da raccogliere via mail</option><option value="telematica_in_riunione">Approvazione telematica già data in riunione</option></select></label>
        <label class="campo largo"><span class="muted">Nome file trascritto (opzionale)</span><input name="trascritto"></label></div>
      <p class="riga"><button type="button" class="primario crea-resoconto">Crea</button><button type="button" class="carica-fonti-prima" title="Trascritto e CSV presenze in _fonti/ prima di creare il resoconto">Carica fonti prima</button></p></form>`;
    const form = container.querySelector('form');
    ui.collegaCampi(form);
    const btnCrea = form.querySelector('.crea-resoconto');
    form.querySelector('.carica-fonti-prima').onclick = () => {
      const v = Object.fromEntries(Array.from(form.querySelectorAll('[name]')).map((el) => [el.name, (el.value || '').trim()]));
      ui.dialogoCaricaFonti(r, { dataIso: LV.md.parseData(v.data) || '', fase: FASI_FONTI.includes(v.fase) ? v.fase : 'SAL', nSal: +v.n_sal || 1 });
    };
    btnCrea.onclick = () => ui.conBottone(btnCrea, async () => {
      const v = Object.fromEntries(Array.from(form.querySelectorAll('[name]')).map((el) => [el.name, (el.value || '').trim()]));
      if (!v.fase) return ui.toast('Indica la fase.', 'avviso');
      if (LV.scrittura.VIETATI.test(v.fase)) return ui.toast('La fase non può contenere \\ / : * ? " < > | (finisce nel nome del file).', 'avviso');
      const dataIso = LV.md.parseData(v.data);
      if (!dataIso) return ui.toast('Data non valida: usa AAAA-MM-GG.', 'avviso');
      if (v.fase === 'Collaudo' && !v.variante) return ui.toast('Scegli la variante del collaudo.', 'avviso');
      const etichetta = LV.sk.etichettaFase(v.fase, +v.n_sal || 1);
      const rel = `${r.rel.split('/').slice(0, -1).join('/')}/${LV.sk.nomeFile(r.codice, etichetta, dataIso)}`;
      if (Object.keys(LV.indice.files).some((k) => k.toLowerCase() === rel.toLowerCase())) return ui.toast(`Esiste già ${rel.split('/').at(-1)}.`, 'avviso');
      const persone = ui.persone().map((p) => p.nome);
      const info = (nome) => (ui.notaPersona(nome) || {}).frontmatter || {};
      const team = LV.sk.teamFromRelease(LV.indice.files[r.rel].text, persone);
      let verbale = null;
      if (etichetta === 'Collaudo' && r.verbali.length) { const vp = r.verbali.at(-1); verbale = LV.verb.parseVerbale(vp, LV.indice.files[vp].text, 0); }
      const dirRilascio = r.rel.split('/').slice(0, -1).join('/');
      let presenze = null, csv = LV.presenze.trovaCsv(dirRilascio, dataIso);   // nuovo_resoconto.py: solo il CSV di QUESTA data
      if (csv) {
        try { presenze = LV.presenze.parse(await LV.vault.leggiBinario(csv), csv.split('/').at(-1)); if (!presenze.adm.length && !presenze.sogei.length) presenze = null; }
        catch (e) { ui.toast(`CSV presenze non leggibile (${e.message}): partecipanti dal team della scheda.`, 'avviso'); presenze = null; }
      }
      const avvisi = presenze ? [`Partecipanti dal report presenze ${csv.split('/').at(-1)}.`] : ['Partecipanti dal team della scheda (lista incompleta): integra con il report presenze.'];
      if (etichetta === 'Collaudo' && !verbale) avvisi.push('Nessun Verbale di Collaudo: ESITO senza casi di test.');
      let testo;
      try { testo = LV.sk.creaScheletro(r.frontmatter, etichetta, dataIso, { team, variante: v.variante || null, verbale, trascritto: v.trascritto, info, oggiIso: oggi, presenze }); }
      catch (e) { return ui.toast(e.message, 'avviso'); }
      try { await LV.vault.creaFile(rel, testo); } catch (e) { return ui.toast(e.message, 'errore', true); }
      try {
        const s = LV.indice.files[r.rel];
        await LV.vault.scriviFile(r.rel, LV.sk.aggiungiRiunione(s.text, dataIso, LV.sk.faseTabella(etichetta), v.trascritto, LV.modelli.stemDi(rel)), s.lastModified);
        const av = await LV.vault.avanzaStato(r.rel, oggi).catch(() => null);   // la riga è scritta: un conflitto qui non è "riga non aggiunta"
        if (av) ui.toast(`Stato ${r.codice}: ${av.da || '(vuoto)'} → ${av.a}`, 'ok');
      } catch (e) {   // come nuovo_resoconto.py: il file c'è, la riga si aggiunge a mano
        if (!(e instanceof LV.vault.ConflittoModifica)) return ui.toast(e.message, 'errore', true);
        avvisi.push('Scheda cambiata nel frattempo: riga Riunioni non aggiunta (aggiungila a mano).');
      }
      if (presenze) {   // come nuovo_resoconto.crea_resoconto: stub Anagrafica e email mancanti
        try { const a = await LV.anagrafica.aggiornaDaPresenze(presenze); if (a.created.length) avvisi.push(`Stub Anagrafica creati: ${a.created.join(', ')}.`); for (const err of a.errori) avvisi.push(`Anagrafica: ${err}`); }
        catch (e) { avvisi.push(`Anagrafica non aggiornata: ${e.message}`); }
      }
      for (const a of avvisi) ui.toast(a, 'avviso');
      dopo(LV.modelli.notaId(rel), avvisi);
    });
  };

  ui.riportaInBozza = function (res, r, nid) {
    if (!r) return ui.toast('Scheda del rilascio non trovata: impossibile aggiornare la tabella Riunioni.', 'errore', true);
    ui.conferma('Sposta .md/.docx/.pdf fuori da inviati/, elimina il .msg già inviato, imposta inviato: false, svuota la scadenza e segna ❌ nella scheda. Dopo le correzioni rigenera il .docx dal master; il sync genera il nuovo .msg.', 'Riporta in bozza', { titolo: 'Riportare il resoconto in bozza?' }).then(async (ok) => {
      if (!ok) return;
      try {
        const { nuovo, avvisi } = await LV.vault.riportaInBozza(res, r);
        ui.toast('Resoconto riportato in bozza.', 'ok');
        for (const a of avvisi) ui.toast(a, 'avviso', true);
        ui.naviga(`#/resoconto/${encodeURIComponent(LV.modelli.notaId(nuovo))}/modifica`);
      } catch (e) { ui.toast(`${e.parziale ? 'Rettifica interrotta, verifica i file del rilascio' : 'Rettifica non riuscita'}: ${e.message}`, 'errore', true); }
    });
  };
})(window.LV);

/* === 76_ui_derivati.js === */
/* Derivati del resoconto nel browser (fase 5): riga di stato .docx/mail/.pdf, pulsanti Rigenera .docx, Genera mail
   (finestra allegati) e Mail definitiva; esito con percorso copiabile. Usati dalla pagina del resoconto, dal pannello
   del ciclo di vita e da Bozze da inviare. */
(function (LV) {
  'use strict';
  const ui = LV.ui, esc = LV.esc;
  const MOTIVO_BROWSER = 'Questo browser non sa comprimere (CompressionStream): serve Edge o Chrome 103 o successivi.';
  const nomeMancante = (m) => m.replace(/^\[email mancante: /, '').replace(/\]$/, '');

  function stato(res) {
    const files = LV.indice.files, md = files[res.rel], docx = files[res.rel.replace(/\.md$/, '.docx')];
    const superato = !!docx && !!md && typeof docx.lastModified === 'number' && md.lastModified > docx.lastModified + 1000;   // build_bozze.docx_superato
    return { docx: !!docx, superato, msg: !!res.ha_msg, pdf: !!res.ha_pdf };
  }
  ui.derivatiHtml = function (res) {
    const s = stato(res), fm = res.frontmatter || {};
    const riga = `<span class="muted mono">.docx ${s.docx ? (s.superato ? '⚠️ superato' : '✅') : '❌'} · .msg ${s.msg ? '✅' : '❌'} · .pdf ${s.pdf ? '✅' : '❌'}</span>`;
    const dis = LV.zip.disponibile() ? '' : ` disabled title="${esc(MOTIVO_BROWSER)}"`;
    const btn = [];
    if (!res.in_inviati) {
      btn.push(`<button type="button" class="rigenera-docx"${dis} title="${dis ? esc(MOTIVO_BROWSER) : 'Word dal template: DATA COMPILAZIONE = oggi, mail obsoleta eliminata'}">Rigenera .docx</button>`);
      btn.push(`<button type="button" class="genera-mail"${dis || (s.docx ? '' : ' disabled title="Prima Rigenera .docx: la mail allega il Word"')}>Genera mail</button>`);
    } else if ((fm.inviato || '').trim().toLowerCase() === 'true' && (fm.data_approvazione || '').trim() && s.pdf && !LV.cruscotto.saltaDefinitivo(fm)) {
      btn.push(`<button type="button" class="mail-definitiva"${dis} title="Bozza .msg della versione definitiva con il PDF">Mail definitiva</button>`);
    }
    return `<div class="derivati riga">${riga}<span style="flex:1"></span>${btn.join(' ')}</div>`;
  };
  ui.collegaDerivati = function (container, res, r) {
    const q = (c) => container.querySelector(c);
    const rig = q('.rigenera-docx');
    if (rig) rig.onclick = () => ui.esegui(async () => {
      const x = await LV.vault.rigeneraDocx(res);
      return { avvisi: x.mailEliminata ? ['La mail precedente era superata ed è stata eliminata: rigenerala con "Genera mail".'] : [] };
    }, 'Word rigenerato dal template (DATA COMPILAZIONE = oggi).', rig);
    const gm = q('.genera-mail');
    if (gm) gm.onclick = async () => {
      const scelti = await ui.dialogoAllegati(res, r);
      if (scelti === null) return;
      ui.esegui(async () => {
        const x = await LV.vault.generaMail(res, { allegati: scelti });
        ui.toastPercorso(x.msg);
        return { avvisi: x.mancanti.length ? [`Ciclone email in Anagrafica, da aggiungere a mano in Outlook: ${x.mancanti.map(nomeMancante).join(', ')}`] : [] };
      }, 'Bozza mail .msg creata accanto al resoconto: aprila in Outlook e invia.', gm);
    };
    const md = q('.mail-definitiva');
    if (md) md.onclick = async () => {
      const relDef = res.rel.replace(/\.md$/, ' - definitivo.msg');
      if (relDef in LV.indice.files && !(await ui.conferma(`Esiste già ${relDef.split('/').at(-1)} (forse prodotto dal sync con la firma di Outlook): sovrascriverlo con la bozza del browser?`, 'Sovrascrivi', { titolo: 'Mail definitiva già presente' }))) return;
      ui.esegui(async () => {
      const x = await LV.vault.generaMailDefinitiva(res);
      ui.toastPercorso(x.msg);
      return { avvisi: x.mancanti.length ? [`Ciclone email in Anagrafica, da aggiungere a mano in Outlook: ${x.mancanti.map(nomeMancante).join(', ')}`] : [] };
      }, 'Bozza della mail definitiva creata in inviati/.', md);
    };
  };
  ui.dialogoAllegati = (res, r) => new Promise((fine) => {   // destinatari (sola lettura) e PDF della cartella da allegare; Esc → null
    const scheda = r && LV.indice.files[r.rel] ? LV.indice.files[r.rel].text : '';
    const dest = LV.mail.destinatari(LV.indice.files[res.rel].text, scheda, LV.indice);
    const pdf = LV.vault.pdfDelRilascio(res);
    const d = document.createElement('dialog');
    d.className = 'lv-dialog';
    d.innerHTML = `<form method="dialog"><h3>Genera mail</h3>
      <p><b>Destinatari</b> <span class="muted">(partecipanti del resoconto e team della scheda; si correggono in Outlook)</span></p>
      <p class="mono">${dest.a.map(esc).join(', ') || '<i class="muted">nessun indirizzo risolto</i>'}</p>
      ${dest.mancanti.length ? `<p class="errore">Ciclone email in Anagrafica: ${esc(dest.mancanti.map(nomeMancante).join(', '))}</p>` : ''}
      <p><b>Allegati</b>: il .docx del resoconto${pdf.length ? ' e i PDF spuntati. Per il collaudo telematico allega il documento di analisi con i suoi allegati.' : '. Nessun PDF nella cartella del rilascio.'}</p>
      ${pdf.map((k) => `<label class="riga"><input type="checkbox" name="pdf" value="${esc(k)}"> <span class="mono">${esc(k.split('/').at(-1))}</span></label>`).join('')}
      ${res.ha_msg ? '<p class="muted">Esiste già un .msg: "Genera" lo sovrascrive.</p>' : ''}
      <p class="muted">La firma è quella del template; per quella di Outlook usa Inserisci → Firma prima di inviare.</p>
      <p class="riga"><button type="button" class="primario conferma">Genera</button><button type="button" class="annulla">Annulla</button></p></form>`;
    document.body.appendChild(d);
    let esito = null;
    d.addEventListener('close', () => { d.remove(); fine(esito); });
    d.querySelector('.conferma').onclick = () => { esito = Array.from(d.querySelectorAll('input[name=pdf]:checked')).map((i) => i.value); d.close(); };
    d.querySelector('.annulla').onclick = () => d.close();
    d.showModal();
  });
  ui.toastPercorso = function (rel) {   // una pagina file:// non può aprire Esplora file né Outlook: il percorso relativo è il massimo possibile
    const box = document.getElementById('toasts');
    if (!box) return;
    const win = rel.replace(/\//g, '\\');
    const el = document.createElement('div');
    el.className = 'toast ok';
    el.innerHTML = `Bozza mail: <span class="mono">${esc(win)}</span> <button type="button" class="copia-percorso">Copia percorso</button> <button type="button" class="chiudi" aria-label="chiudi">×</button>`;
    el.querySelector('.copia-percorso').onclick = () => navigator.clipboard.writeText(win)
      .then(() => ui.toast('Percorso copiato: incollalo in Esplora file dentro la cartella del vault.'))
      .catch(() => ui.toast('Copia negli appunti non riuscita: segna il percorso a mano.', 'avviso'));
    el.querySelector('.chiudi').onclick = () => el.remove();
    box.appendChild(el);
  };
})(window.LV);

/* === 77_ui_fonti.js === */
/* Finestra "Carica fonti": trascritti (.docx/.md/.vtt), CSV presenze e PDF in _fonti/<AAAAMMGG> <Fase>/ del rilascio,
   con conversione, Anagrafica e riga Riunioni (LV.fonti.carica). Replica di ui/pages/carica_fonti.py. */
window.LV = window.LV || {};
(function (LV) {
  'use strict';
  const ui = LV.ui, esc = LV.esc;
  const FASI = ['Startup', 'Prima Analisi', 'SAL', 'Collaudo'];

  ui.dialogoCaricaFonti = (r, { dataIso = '', fase = 'SAL', nSal = 1 } = {}) => new Promise((fine) => {
    const dirRilascio = r.rel.split('/').slice(0, -1).join('/');
    const d = document.createElement('dialog');
    d.className = 'lv-dialog';
    d.innerHTML = `<form class="fonti" onsubmit="return false"><h3>Carica fonti — ${esc(r.codice)}</h3>
      <div class="griglia-form">
        ${ui.campoData('data', 'Data riunione', dataIso, { weekend: true })}
        <label class="campo"><span class="muted">Fase</span><select name="fase">${FASI.map((f) => `<option ${f === fase ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
        <label class="campo n-sal"><span class="muted">Numero SAL</span><input name="n_sal" type="number" min="1" value="${esc(String(nSal))}"></label>
      </div>
      <p><input type="file" name="file" multiple accept=".docx,.md,.vtt,.csv,.pdf"></p>
      <p class="muted">Destinazione: _fonti/AAAAMMGG &lt;Fase&gt;/ del rilascio. I .docx/.vtt vengono convertiti in .md, il CSV presenze aggiorna
        l'Anagrafica, il trascritto entra nella riga Riunioni se la colonna è vuota.</p>
      <div class="esiti"></div>
      <p class="riga"><button type="button" class="primario salva-fonti">Salva</button><button type="button" class="sovrascrivi" hidden></button><button type="button" class="chiudi">Chiudi</button></p></form>`;
    document.body.appendChild(d);
    const form = d.querySelector('form');
    ui.collegaCampi(form);
    const selFase = form.querySelector('[name=fase]'), nSalBox = form.querySelector('.n-sal');
    const aggiornaSal = () => { nSalBox.hidden = selFase.value !== 'SAL'; };
    selFase.onchange = aggiornaSal; aggiornaSal();
    let caricato = false, conflitti = [];
    const esiti = form.querySelector('.esiti'), btnSovr = form.querySelector('.sovrascrivi'), btnSalva = form.querySelector('.salva-fonti');
    const mostra = (messaggi, link) => {
      esiti.innerHTML = messaggi.map((m) => `<p class="${/conflitto|rifiutat|non /.test(m) ? 'avviso' : ''}">${esc(m)}</p>`).join('') + (link || '');
      btnSovr.hidden = !conflitti.length;
      btnSovr.textContent = `Sovrascrivi ${conflitti.length} file`;
    };
    const salva = (sovrascrivi) => ui.conBottone(btnSalva, async () => {
      const iso = LV.md.parseData(form.querySelector('[name=data]').value);
      if (!iso) return ui.toast('Data non valida: usa AAAA-MM-GG.', 'avviso');
      const input = form.querySelector('[name=file]');
      if (!input.files.length) return ui.toast('Nessun file caricato.', 'avviso');
      const etichetta = LV.sk.etichettaFase(selFase.value, +form.querySelector('[name=n_sal]').value || 1);
      const faseTab = LV.sk.faseTabella(etichetta);
      const files = [];
      for (const f of input.files) files.push({ nome: f.name, bytes: new Uint8Array(await f.arrayBuffer()) });
      let out;
      try { out = await LV.fonti.carica({ dirRilascio, schedaRel: r.rel, dataIso: iso, faseTab, files, sovrascrivi }); }
      catch (e) { return ui.toast(`Caricamento non riuscito: ${e.message}`, 'errore', true); }
      caricato = true;
      conflitti = out.conflitti;
      let link = '';
      if (out.resocontoBozza && out.presenze) {
        const nid = LV.modelli.notaId(out.resocontoBozza);
        link = `<p><a href="#/resoconto/${encodeURIComponent(nid)}/modifica?presenze=1" class="apri-editor-presenze">Apri l'editor del resoconto e importa le presenze</a></p>`;
      }
      mostra(out.messaggi, link);
      const a = esiti.querySelector('.apri-editor-presenze');
      if (a) a.onclick = () => d.close();
    });
    btnSalva.onclick = () => salva(new Set());
    btnSovr.onclick = () => salva(new Set(conflitti));
    form.querySelector('.chiudi').onclick = () => d.close();
    d.addEventListener('close', () => { d.remove(); if (caricato) ui.naviga(); fine(); });
    d.showModal();
  });
})(window.LV);

/* === 78_ui_convocazione.js === */
/* Finestra "Convoca startup" / "Convoca collaudo": bozza .eml con invito calendario (+ PDF del piano di test e Verbale di
   Collaudo per il collaudo) scritta nella cartella del rilascio da LV.vault.generaConvocazione. Replica di ui/pages/convocazione.py. */
window.LV = window.LV || {};
(function (LV) {
  'use strict';
  const ui = LV.ui, esc = LV.esc, C = LV.conv;

  ui.dialogoConvocazione = (r, tipo) => new Promise((fine) => {
    const startup = tipo === 'startup', oggi = LV.cruscotto.oggi(), dir = r.rel.split('/').slice(0, -1).join('/');
    const fm = LV.md.parseFrontmatter(LV.indice.files[r.rel].text);
    const dataProposta = startup ? C.giorniLavorativiDopo(oggi, 7) : C.dataProposta(fm, oggi);
    const organizzatore = C.organizzatoreDefault(LV.indice, LV.ui.anno || LV.vault.annoDefault());
    const pre = startup ? null : (() => {   // precompila_collaudo: Piano di Test.md e PDF del rilascio
      const relPiano = C.trovaPianoTest(dir, LV.indice);
      const piano = relPiano ? C.parsePianoTest(LV.indice.files[relPiano].text) : { documento: '', verifiche: [] };
      return { ...piano, trovato: !!relPiano, pdf: LV.vault.pdfDelRilascioEFonti(dir) };
    })();
    const d = document.createElement('dialog');
    d.className = 'lv-dialog';
    d.innerHTML = `<form class="convocazione" onsubmit="return false"><h3>Convoca ${startup ? 'startup' : 'collaudo'} — ${esc(r.codice)}</h3>
      <div class="griglia-form">
        ${ui.campoData('data', 'Data (AAAA-MM-GG)', dataProposta, { weekend: true })}
        <label class="campo"><span class="muted">Ora</span><input name="ora" value="10:00" placeholder="HH:MM"></label>
        <label class="campo"><span class="muted">Durata (min)</span><input name="durata" type="number" min="15" value="${startup ? 30 : 60}"></label>
        <label class="campo"><span class="muted">Organizzatore (mittente)</span><input name="organizzatore" value="${esc(organizzatore)}" placeholder="nome.cognome@adm.gov.it"></label>
      </div>
      ${!startup && !dataProposta ? '<p class="avviso">Data non proponibile (data_disponibilita_collaudo assente o DA COMPLETARE): indicala a mano.</p>' : ''}
      ${startup ? `<p class="muted">Date alternative (facoltative)</p><div class="griglia-form">${[1, 2, 3].map((i) => `${ui.campoData(`alt_data_${i}`, `Alternativa ${i} (AAAA-MM-GG)`, '', { weekend: true })}<label class="campo"><span class="muted">Ora</span><input name="alt_ora_${i}" placeholder="HH:MM"></label>`).join('')}</div>`
        : `${pre.trovato ? '' : '<p class="avviso">Piano di Test.md non trovato: compila documento e verifiche a mano.</p>'}
      <label class="campo"><span class="muted">PDF del piano di test (allegato)</span><select name="pdf"><option value="">—</option>${pre.pdf.map((k) => `<option value="${esc(k)}" ${pre.pdf.length === 1 ? 'selected' : ''}>${esc(k.slice(dir.length + 1))}</option>`).join('')}</select></label>
      <label class="campo"><span class="muted">Documento di analisi</span><input name="documento" value="${esc(pre.documento)}"></label>
      <label class="campo"><span class="muted">Casi di test (uno per riga)</span><textarea name="verifiche" rows="8">${esc(pre.verifiche.join('\n'))}</textarea></label>`}
      <p class="muted">Genera una bozza .eml da aprire in Outlook e inviare a mano; se esiste già viene sostituita, il Verbale non viene mai sovrascritto. Nessuna mail viene inviata dall'app.</p>
      <div class="esiti"></div>
      <p class="riga"><button type="button" class="primario genera">Genera</button><button type="button" class="chiudi">Chiudi</button></p></form>`;
    document.body.appendChild(d);
    const form = d.querySelector('form');
    ui.collegaCampi(form);
    const v = (n) => (form.querySelector(`[name=${n}]`).value || '').trim();
    let generato = false;
    const esiti = form.querySelector('.esiti'), btn = form.querySelector('.genera');
    btn.onclick = () => ui.conBottone(btn, async () => {
      const dataIso = LV.md.parseData(v('data'));
      if (!dataIso) return ui.toast('Data non valida: usa AAAA-MM-GG.', 'avviso');
      const ora = v('ora'), motivo = C.validaOra(ora);
      if (motivo) return ui.toast(motivo, 'avviso');
      const organizzatore = v('organizzatore');
      if (!organizzatore.includes('@')) return ui.toast('Organizzatore: serve un indirizzo email.', 'avviso');
      const durata = Math.max(15, parseInt(v('durata'), 10) || 0);
      const o = { schedaRel: r.rel, tipo, dataIso, ora, durata, organizzatore };
      if (startup) {
        const alt = C.alternativeDaRighe([1, 2, 3].map((i) => [v(`alt_data_${i}`), v(`alt_ora_${i}`)]));
        if (alt.errore) return ui.toast(alt.errore, 'avviso');
        o.alternative = alt.alternative;
      } else {
        o.pdfRel = v('pdf'); o.documento = v('documento'); o.verifiche = C.pulisciVerifiche(v('verifiche'));
        if (!o.pdfRel || !o.documento) return ui.toast('PDF e documento di analisi sono obbligatori.', 'avviso');
        if (!o.verifiche.length) return ui.toast('Almeno un caso di test.', 'avviso');
      }
      let out;
      try { out = await LV.vault.generaConvocazione(o); }
      catch (e) { return ui.toast(`Convocazione non generata: ${e.message}`, 'errore', true); }
      generato = true;
      const win = out.eml.replace(/\//g, '\\');
      const righe = [`<p>Bozza: <span class="mono">${esc(win)}</span> <button type="button" class="copia-percorso">Copia percorso</button></p>`,
        `<p>A: <span class="mono">${esc(out.a) || '<i class="muted">nessuno</i>'}</span> · Cc: <span class="mono">${esc(out.cc.join(', ')) || '<i class="muted">nessuno</i>'}</span></p>`];
      if (!out.a) righe.push('<p class="avviso">Destinatario A non risolto: completalo in Outlook</p>');
      if (out.mancanti.length) righe.push(`<p class="avviso">Email mancanti in Anagrafica: ${esc(out.mancanti.join(', '))}</p>`);
      if (out.bozzaEliminata) righe.push(`<p>Bozza precedente eliminata: <span class="mono">${esc(out.bozzaEliminata.split('/').at(-1))}</span></p>`);
      if (out.verbaleRinominato) righe.push(`<p>Verbale rinominato: <span class="mono">${esc(out.verbaleRinominato.split('/').at(-1))}</span> → <span class="mono">${esc(out.verbale.split('/').at(-1))}</span> (esiti conservati)</p>`);
      else if (out.verbale) righe.push(out.verbaleEsistente ? '<p>Verbale già presente, non sovrascritto</p>' : `<p>Verbale creato: <span class="mono">${esc(out.verbale.split('/').at(-1))}</span></p>`);
      esiti.innerHTML = righe.join('');
      esiti.querySelector('.copia-percorso').onclick = () => navigator.clipboard.writeText(win)
        .then(() => ui.toast('Percorso copiato: incollalo in Esplora file dentro la cartella del vault.'))
        .catch(() => ui.toast('Copia negli appunti non riuscita: segna il percorso a mano.', 'avviso'));
    });
    form.querySelector('.chiudi').onclick = () => d.close();
    d.addEventListener('close', () => { d.remove(); if (generato) ui.naviga(); fine(); });
    d.showModal();
  });
})(window.LV);

      <p class="muted">I .docx vanno nella cartella del rilascio e compaiono in Da firmare quando il collaudo è registrato come svolto; i PDF per Arcipelago li prepara il sync del PC master. Rileggi l'intestazione in Word prima della firma.</p>

        + `<p><button type="button" class="copia-percorso">Copia percorso della cartella</button></p>`;

        .catch(() => ui.toast('Copia negli appunti non riuscita: segna il percorso a mano.', 'avviso'));

/* === 80_ui_modifica.js === */
/* Modifica scheda: solo i campi strutturati, scrive solo le chiavi cambiate (traduzione di rilascio_modifica.py). */
(function (LV) {
  'use strict';
  const esc = LV.esc, ui = LV.ui, S = LV.scrittura;
  const conCorrente = (opz, v) => opz.concat(v && !opz.includes(v) ? [v] : []);
  const sel = (nome, label, opz, v) => `<label class="campo"><span class="muted">${esc(label)}</span><select name="${nome}">${opz.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  const txt = (nome, label, v, largo = false) => `<label class="campo ${largo ? 'largo' : ''}"><span class="muted">${esc(label)}</span><input type="text" name="${nome}" value="${esc(v)}"></label>`;
  ui.modificaScheda = function (main, codice) {
    const r = LV.vault.rilascio(codice);
    ui.titolo(`Modifica ${codice}`);
    if (!r) { main.innerHTML = `<p>Nessun rilascio con codice "${esc(codice)}". <a href="#/">Torna ai rilasci</a></p>`; return; }
    const fm = r.frontmatter;
    let baseline = r.lastModified;
    main.innerHTML = `${ui.datalistPersone()}<form class="modifica" onsubmit="return false"><h2>Modifica ${esc(codice)}</h2>
      <div class="card"><b>Anagrafica</b><div class="griglia-form">
        ${txt('descrizione_rilascio', 'Descrizione rilascio', fm.descrizione_rilascio || '', true)}
        ${txt('descrizione_sottoprogetto', 'Descrizione sottoprogetto', fm.descrizione_sottoprogetto || '')}
        ${txt('descrizione_progetto', 'Descrizione progetto', fm.descrizione_progetto || '')}
        ${sel('stato', 'Stato', conCorrente(S.STATI, fm.stato || 'Bozza'), fm.stato || 'Bozza')}
        ${sel('vincoli_normativi', 'Vincoli normativi', conCorrente(['Sì', 'No'], fm.vincoli_normativi || 'No'), fm.vincoli_normativi || 'No')}
        ${txt('nota_variazione_date', 'Nota variazione date', fm.nota_variazione_date || '')}
        <label class="campo"><span class="muted">Avanzamento automatico</span><span><input type="checkbox" name="stato_manuale" ${(fm.stato_manuale || '').trim().toLowerCase() === 'true' ? 'checked' : ''}> Stato manuale (blocca l'avanzamento automatico)</span></label></div></div>
      <div class="card"><b>Team</b><div class="griglia-form">${S.CAMPI_TEAM.map(([k, l]) => (k === 'struttura_business' ? txt(k, l, fm[k] || '') : ui.campoPersona(k, l, fm[k] || ''))).join('')}</div></div>
      <div class="card"><b>Date (AAAA-MM-GG)</b><div class="griglia-form">${S.CAMPI_DATE.map(([k, l]) => ui.campoData(k, l, fm[k] || '')).join('')}</div></div>
      <div class="card protocolli"><b>Protocolli</b><div class="griglia-form">${S.CAMPI_PROTOCOLLI.map(([k, l]) => txt(k, l, fm[k] || '', true)).join('')}</div>
        <p class="muted">Numero e data del protocollo ADM, es. <span class="mono">1068 del 05/10/2026 (Registro Contratto; rif. SOGEI 58059/RU)</span>; <span class="mono">DA COMPLETARE</span> finché manca il numero ADM (il riferimento SOGEI non è un protocollo ADM). La tabella "Allegati protocolli" si compila in Obsidian.</p></div>
      <p class="riga"><button type="button" class="primario salva">Salva modifiche</button><a class="bottone" href="#/rilascio/${esc(codice)}">Annulla</a><span class="azioni-conflitto"></span></p></form>`;
    const form = main.querySelector('form');
    ui.collegaCampi(form);
    const valori = () => Object.fromEntries(Array.from(form.querySelectorAll('[name]')).map((el) => [el.name, el.type === 'checkbox' ? (el.checked ? 'true' : '') : (el.value || '').trim()]));
    const iniziali = valori();
    const btnSalva = form.querySelector('.salva');
    btnSalva.onclick = () => ui.conBottone(btnSalva, async () => {
      const v = valori();
      const err = S.validaDateIso(v);
      if (err) return ui.toast(err, 'avviso');
      const mod = S.diffCampi(v, iniziali);
      if (!Object.keys(mod).length) return ui.toast('Nessuna modifica da salvare.');
      const f = LV.indice.files[r.rel];
      const nuovo = LV.md.updateFrontmatterKeys(f.text, mod);
      if (nuovo === f.text) return ui.toast('Frontmatter non riconosciuto in questa scheda (deve iniziare con --- alla prima riga): nessuna scrittura. Correggila in Obsidian.', 'errore', true);
      try {
        await LV.vault.scriviFile(r.rel, nuovo, baseline);
      } catch (e) {
        ui.toast(e.message, 'errore', true);
        if (e instanceof LV.vault.ConflittoModifica) ui.pulsanteRicarica(form, r.rel, () => { baseline = LV.indice.files[r.rel].lastModified; });   // con try/catch se il file è sparito
        return;
      }
      ui.toast(`Scheda aggiornata (${Object.keys(mod).join(', ')}).`, 'ok');
      if (!('stato' in mod)) {   // stato scelto a mano in questo salvataggio: non lo si riavanza (lo farà il sync del master, salvo stato_manuale)
        const av = await LV.vault.avanzaStato(r.rel).catch(() => null);
        if (av) ui.toast(`Stato ${codice}: ${av.da || '(vuoto)'} → ${av.a}`, 'ok');
      }
      ui.naviga(`#/rilascio/${codice}`);
    });
  };
})(window.LV);

      <div class="card"><b>Date e vincoli</b><div class="griglia-form">${ui.campoData('data_collaudo_prevista', 'Collaudo previsto', '')}${ui.campoData('data_rilascio_prevista', 'Rilascio previsto', '')}

/* Verbale di Collaudo: verifiche con esito, esito complessivo; Salva riscrive le tre sezioni (traduzione di verbale.py). */
(function (LV) {
  'use strict';
  const esc = LV.esc, ui = LV.ui, V = LV.verb;
  const ESITI = ['', 'Superato', 'Non superato'];
  const SEZIONI = ['Riepilogo verifiche', 'Dettaglio verifiche', 'Esito complessivo'];
  const sel = (nome, opz, v) => `<select name="${nome}">${opz.map((o) => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o) || '—'}</option>`).join('')}</select>`;
  ui.rotte.verbale = function (main, nid) {
    const n = LV.indice.note[nid];
    ui.titolo('Verbale di Collaudo');
    if (!n || !n.rel.includes('Verbale di Collaudo')) { main.innerHTML = '<p>Verbale non trovato. <a href="#/">Torna ai rilasci</a></p>'; return; }
    const f = LV.indice.files[n.rel];
    const v = V.parseVerbale(n.rel, f.text, f.lastModified);
    const codice = v.frontmatter.codice_rilascio || '';
    const extra = LV.res.spezzaSezioni(LV.md.splitBody(f.text)).blocchi.map((b) => b.heading).filter((h) => !SEZIONI.includes(h));
    let verifiche = v.verifiche.map((x) => ({ ...x }));
    main.innerHTML = `<form class="verbale" onsubmit="return false"><div class="riga"><h2>${esc(n.titolo)}</h2><span style="flex:1"></span>${codice ? `<a class="bottone" href="#/rilascio/${esc(codice)}">${esc(codice)}</a>` : ''}<a class="bottone" href="#/nota/${encodeURIComponent(nid)}">Nota grezza</a></div>
      ${v.problemi.length ? `<p class="errore">${esc(v.problemi.join('; '))}</p>` : ''}
      ${extra.length ? `<p class="errore">Verbale con sezioni aggiuntive (${esc(extra.join(', '))}): modificalo in Obsidian, qui il salvataggio è disabilitato.</p>` : ''}
      <div class="verifiche"></div><p><button type="button" class="aggiungi-verifica">Aggiungi verifica</button></p>
      <div class="card"><b>Esito complessivo</b><div class="griglia-form">
        <label class="campo"><span class="muted">Esito</span>${sel('esito_complessivo', [''].concat(V.ESITI_VERBALE), v.esito_complessivo)}</label>
        ${ui.campoDataIt('data_verbale', 'Data verbale (GG/MM/AAAA)', v.data_verbale, { weekend: true })}
        <label class="campo largo"><span class="muted">Presenti</span><input name="presenti" value="${esc(v.presenti)}"></label>
        <label class="campo largo"><span class="muted">Riserve / azioni correttive</span><input name="riserve" value="${esc(v.riserve)}"></label></div></div>
      <p class="riga"><button type="button" class="primario salva" ${extra.length ? 'disabled' : ''}>Salva</button><a class="bottone" href="#/rilascio/${esc(codice)}">Annulla</a><span class="azioni-conflitto"></span></p></form>`;
    const form = main.querySelector('form');
    ui.collegaCampi(form);
    const render = () => {
      form.querySelector('.verifiche').innerHTML = verifiche.map((x) => `<div class="card verifica" data-n="${x.n}"><div class="riga"><span class="muted">${x.n}.</span><input name="nome" value="${esc(x.nome)}" style="flex:1">${sel('esito', ESITI.concat(x.esito && !ESITI.includes(x.esito) ? [x.esito] : []), x.esito)}</div>
        <div class="riga"><input name="data" value="${esc(x.data)}" placeholder="Data GG/MM/AAAA" style="width:140px"><input name="testato_da" value="${esc(x.testato_da)}" placeholder="Testato da" style="flex:1"><input name="note" value="${esc(x.note)}" placeholder="Note / anomalie" style="flex:2"></div></div>`).join('');
    };
    const leggi = () => {
      verifiche = Array.from(form.querySelectorAll('.verifica')).map((row) => ({ n: +row.dataset.n, nome: row.querySelector('[name=nome]').value.trim(), esito: row.querySelector('[name=esito]').value,
        data: row.querySelector('[name=data]').value.trim(), testato_da: row.querySelector('[name=testato_da]').value.trim(), note: row.querySelector('[name=note]').value.trim() }));
    };
    render();
    form.querySelector('.aggiungi-verifica').onclick = () => { leggi(); verifiche.push({ n: verifiche.length + 1, nome: '', esito: '', data: '', testato_da: '', note: '' }); render(); };
    const btnSalva = form.querySelector('.salva');
    btnSalva.onclick = () => ui.conBottone(btnSalva, async () => {
      leggi();
      const dataRaw = form.querySelector('[name=data_verbale]').value.trim();
      const dataIso = dataRaw ? LV.md.parseData(dataRaw) : '';
      if (dataRaw && !dataIso) return ui.toast('Data verbale non valida: usa GG/MM/AAAA.', 'avviso');
      v.verifiche = verifiche.filter((x) => x.nome);
      v.esito_complessivo = form.querySelector('[name=esito_complessivo]').value;
      v.data_verbale = dataIso ? `${dataIso.slice(8)}/${dataIso.slice(5, 7)}/${dataIso.slice(0, 4)}` : '';
      v.presenti = form.querySelector('[name=presenti]').value.trim();
      v.riserve = form.querySelector('[name=riserve]').value.trim();
      try { await LV.vault.scriviFile(n.rel, V.serVerbale(v, LV.cruscotto.oggi()), v.lastModified); }
      catch (e) {
        ui.toast(e.message, 'errore', true);
        if (e instanceof LV.vault.ConflittoModifica) ui.pulsanteRicarica(form, n.rel, () => { v.lastModified = LV.indice.files[n.rel].lastModified; });
        return;
      }
      ui.toast('Verbale salvato (riepilogo e dettaglio riallineati).', 'ok');
      ui.naviga();   // si resta sul verbale, ridisegnato dal file salvato (come verbale.py)
    });
  };
})(window.LV);

/* === manuale === */
LV.manuale = "# Manuale di LeviathADM\n\nLeviathADM è il cruscotto del Piano Operativo (PO): legge e scrive direttamente i file markdown del vault Obsidian (\"PO 2026/\", \"Anagrafica/\") e non ha un database. Esiste in due versioni con le stesse regole:\n\n| Versione | Come si avvia | Quando usarla |\n|---|---|---|\n| **Python** (dashboard locale) | `leviathadm.cmd` nella radice del vault, poi `http://127.0.0.1:8080` | PC con Python: tutte le funzioni, comprese le azioni che lanciano gli script (convocazioni, sync, Word, Outlook) |\n| **Web** (`leviathadm.html`) | doppio clic sul file in Edge o Chrome, poi \"Apri cartella\" | PC senza Python: lettura e scrittura del vault nel browser, nessuna installazione |\n\nQuesto manuale è lo stesso nelle due versioni: le differenze sono indicate dove servono e riassunte in fondo.\n\n**Regola che vale sempre:** l'applicazione **non invia mai una mail**. Produce solo bozze (`.msg` per i resoconti, `.eml` per le convocazioni) che si aprono in Outlook e si inviano a mano.\n\n---\n\n## Avvio\n\n**Versione Python.** `leviathadm.cmd` crea l'ambiente virtuale `.venv/` al primo avvio, installa i requisiti, verifica pacchetti, Outlook, Word, pandoc, ruolo del PC e porta, poi apre il server su `http://127.0.0.1:8080`. Opzioni: `--check` (solo verifiche), `--porta N` (altra porta). L'app va avviata da una console propria e fermata con Ctrl+C. Nel pack demo `leviathadm.cmd` usa il Python embedded della cartella `python/`.\n\n**Versione Web.** Aprire `leviathadm.html`, premere **Apri cartella…** e scegliere la cartella del vault (quella che contiene `PO 2026/` e `Anagrafica/`). Il browser chiede il permesso a ogni apertura e non memorizza nulla della cartella scelta. Serve Edge o Chrome (File System Access); se una policy aziendale blocca l'accesso ai file compare un avviso nella schermata iniziale. Il pulsante **⟳** nell'header rilegge tutti i file dal disco. Dal 1.5.0 la web ricorda l'ultima cartella aperta da quella copia dell'app (handle in IndexedDB, chiave = percorso del file): alla prossima apertura basta «Riapri», il browser richiede solo il permesso; «dimentica» cancella il ricordo (consigliato su PC condivisi: altri file HTML aperti nello stesso browser potrebbero leggere l'handle, ma per usarlo dovrebbero ottenere di nuovo il permesso da te).\n\n**Header e menu.** Il menu laterale (☰) elenca le viste; il selettore del **piano** (anno) nell'header sceglie la cartella `PO <anno>/` quando il vault ne contiene più di una; **◐** cambia tema chiaro/scuro. Nella versione Python c'è anche la **ricerca globale** (Ctrl+K) su codici, titoli e testi delle note.\n\n---\n\n## Rilasci\n\nLa vista iniziale elenca i punti di piano del piano selezionato: codice, descrizione, stato, PM, RA, RP, collaudo previsto / effettivo, rilascio previsto / effettivo. Le intestazioni ordinano la tabella (per data dove la colonna è una data); i filtri in alto restringono per stato o testo.\n\nGli **stati** del ciclo di vita, in ordine: Da Avviare, Bozza, Startup, Analisi, In corso, In Verifica, Collaudo, Concluso. Lo stato aggiuntivo **Rinominato** segnala una scheda storica rinumerata o confluita in un altro codice (campo `codice_rilascio_successivo`).\n\n### Dettaglio del rilascio\n\nUn clic sulla riga apre la scheda `ADMxxx-xx-xX.md`:\n\n- **Metadati e team**: codici e descrizioni di progetto, sottoprogetto e rilascio; PM, RA, RP, referente business e struttura, referente SOGEI; vincoli normativi; date; protocolli.\n- **Ciclo di vita**: lo stepper delle riunioni (Startup → Prima Analisi → SAL → Collaudo) con, per ogni fase, il resoconto collegato. Lo step **+** crea un nuovo resoconto (vedi \"Resoconti\").\n- **Riunioni, Azioni aperte, Decisioni chiave, Prossima riunione**: le sezioni della scheda. Le azioni con una scadenza (`— scadenza: GG/MM/AAAA`) compaiono anche in Scadenze.\n- **Allegati protocolli**: la tabella dei documenti protocollati (analisi, approvazione, disponibilità a collaudo, collaudo, estensione).\n- **Modifica scheda**: modulo con i campi del frontmatter (anagrafica, team, date e i cinque **protocolli**: analisi, approvazione analisi, disponibilità a collaudo, collaudo, estensione esercizio — numero e data del protocollo ADM, `DA COMPLETARE` finché manca il numero; il riferimento SOGEI non è un protocollo ADM). Si salvano **solo le chiavi cambiate**; le date si normalizzano in ISO; `DA COMPLETARE` è ammesso dove un dato non è ancora noto. La tabella \"Allegati protocolli\" si compila in Obsidian.\n- **Carica fonti** (entrambe le versioni): trascritti, CSV presenze e PDF di una riunione in `_fonti/` (vedi \"Carica fonti\" sotto Resoconti).\n- **Convoca startup / Convoca collaudo** (entrambe le versioni): bozza `.eml` con invito calendario (vedi \"Convocazioni\" sotto Resoconti).\n- **Lettere di fine collaudo** (entrambe le versioni): i `.docx` di Trasmissione copia verbale e Richiesta estensione in esercizio compilati dai template (vedi \"Lettere di fine collaudo\" sotto Resoconti).\n- **Azioni** (solo Python): Convocazione startup, Convocazione collaudo, Genera mail resoconto, Prepara cartella firma. Lanciano gli script del vault in un sottoprocesso; l'output compare nel pannello.\n\n### Stato del rilascio\n\nLo stato non va più tenuto a mano: ogni volta che l'app scrive una milestone nella scheda (riga Riunioni di un nuovo resoconto, trascritto caricato, ✅ di invio, data di collaudo effettiva, lettere in firma o protocollate, protocolli salvati da Modifica scheda) lo stato **avanza da solo** allo stato suggerito dai fatti registrati, sempre e solo in avanti: Da Avviare → Bozza → Startup → Analisi → In corso → In Verifica → Collaudo → Concluso. La regola è in `SCHEMA.md` (\"Avanzamento automatico dello stato\"); il sync del master e il daily check la applicano in blocco a tutte le schede, così valgono anche le modifiche fatte in Obsidian.\n\nNel dettaglio rilascio, accanto allo stato, compare `→ <suggerito>` e il pulsante **Avanza stato** quando il suggerito supera lo stato scritto. Per bloccare l'automatismo su una scheda, in Modifica scheda spunta **Stato manuale**: resta il solo badge. Uno stato scelto a mano in Modifica scheda non viene riavanzato in quello stesso salvataggio; `Rinominato` non si tocca mai.\n\n### Nuovo punto di piano\n\nDal menu **Nuovo punto di piano**: codice rilascio, sottoprogetto, descrizioni, ruoli, date. Crea la cartella `PO <anno>/<codice>/` e la scheda nello stesso formato di quelle generate dall'Excel PO. Il codice deve avere la forma `ADMxxx-xx-xX` e non esistere già. I campi persona suggeriscono i nomi dell'Anagrafica e con l'icona a destra creano al volo una nuova persona.\n\n---\n\n## Resoconti\n\nOgni riunione produce un resoconto `ADMxxx-xx-xX - AAAAMMGG Resoconto <Tipo>.md` nella cartella del rilascio (la **bozza**); dopo l'invio i file passano in `inviati/`.\n\n### Nuovo resoconto\n\nDallo step **+** del ciclo di vita (o dal pulsante \"Nuovo resoconto\" nella versione Python): si sceglie la fase (uguale o successiva all'ultima già fatta, o un testo libero) e la data. Viene generato lo **scheletro** con le sezioni fisse già compilate dalla scheda e dall'Anagrafica: tabelle RIUNIONE / RESOCONTO / OBIETTIVO, LISTA PARTECIPANTI, formula dell'OBIETTIVO DELLA RIUNIONE; nella scheda viene aggiunta la riga in `## Riunioni` con ❌ (non inviato). Restano da scrivere **ARGOMENTI TRATTATI** e **AZIONI CONCORDATE** (per il collaudo: ESITO, con i casi di test presi dal Verbale).\n\nSe nella cartella del rilascio c'è il **CSV presenze di Teams** con la data della riunione (caricato con \"Carica fonti\"), la LISTA PARTECIPANTI nasce dai presenti veri (ruoli PM/RA/RP/RB riconosciuti dal team della scheda, referente SOGEI per primo) e i presenti nuovi ricevono una scheda in Anagrafica; altrimenti dal team della scheda, con la nota \"[lista incompleta — integrare con report presenze Teams]\". Nell'editor il pulsante **Importa CSV presenze** sostituisce le liste ADM e SOGEI con quelle del CSV della data del resoconto.\n\n### Carica fonti\n\nDal dettaglio del rilascio (o dal modulo Nuova riunione, \"Carica fonti prima\"): data, fase e uno o più file — trascritti `.docx`/`.md`/`.vtt`, il CSV presenze scaricato da Teams (col suo nome originale: contiene la data), PDF. I file vanno in `_fonti/AAAAMMGG <Fase>/` del rilascio; i `.docx` e i `.vtt` vengono convertiti in `.md` (nella versione Python con pandoc, nella Web con il lettore Word dell'app: stesso testo, senza pandoc); il CSV aggiorna l'Anagrafica (schede nuove, email mancanti); il primo trascritto entra nella riga `## Riunioni` se la colonna è vuota. Per ogni file compare l'esito: salvato, identico (già presente uguale), conflitto (esiste con contenuto diverso: \"Sovrascrivi\" per forzare), rifiutato (estensione non ammessa o oltre 200 MB). Se il resoconto di quella riunione esiste già in bozza, un link apre l'editor con le presenze importate (da salvare).\n\n### Editor a sezioni\n\nIl resoconto si modifica sezione per sezione: partecipanti (selettore con i nomi dell'Anagrafica), argomenti, azioni (una per riga, con responsabile e data), esito del collaudo. Si riscrivono **solo le sezioni cambiate**; `data_riunione`, `approvato_da` e `data_approvazione` restano allineati tra frontmatter e tabelle. Sotto lo stepper del ciclo di vita compare il resoconto della fase scelta: editor inline se è una bozza, sola lettura con il lucchetto se è già inviato.\n\n### Dal markdown al Word\n\n- **Rigenera .docx** produce il documento Word ufficiale dal `.md` con il template giusto (startup/analisi/SAL, collaudo con firme o con approvazione telematica) e imposta DATA COMPILAZIONE a oggi, nel `.md` e nel Word. Il `.msg` precedente, ormai superato, viene eliminato. Funziona in entrambe le versioni: nel browser il Word nasce dallo stesso template, letto dalla cartella `Template/` del vault, e viene scritto accanto al `.md`.\n- **Genera mail** crea la bozza `.msg` con il Word allegato: oggetto, testo dal template di mail (variante telematica per i collaudi con approvazione telematica), destinatari dai partecipanti del resoconto e dal team della scheda (email dall'Anagrafica; chi non ha l'email viene elencato, da aggiungere a mano in Outlook). Nella finestra scegli i PDF della cartella del rilascio da allegare (per il collaudo telematico il documento di analisi con i suoi allegati). Nella versione Python la bozza la compone Outlook stesso, con la firma istituzionale; nel browser il `.msg` è scritto dall'app e porta la firma testuale del template: per quella di Outlook usa Inserisci → Firma prima di inviare. Il `.msg` si apre con doppio clic (versione Python: pulsanti **Apri in Outlook** e **Apri cartella**; Web: **Copia percorso** nell'esito).\n- Se modifichi il `.md` dopo aver generato Word e mail, Bozze da inviare segnala ⚠️ \"docx superato\": rigenera il Word e poi la mail. Anche il sync (versione Python) rigenera i Word superati.\n\n### Invio e approvazione tacita\n\n1. Quando la mail è stata inviata davvero, **Segna inviato** (vista \"Bozze da inviare\"): i file passano in `inviati/`, `inviato: true`, `data_scadenza_approvazione` = +5 giorni lavorativi, ✅ nella scheda.\n2. Alla scadenza senza osservazioni il resoconto è approvato tacitamente: **Chiudi approvazione** registra `data_approvazione`; PDF e mail definitiva li completa il sync del master.\n3. **Mail definitiva** (quando il PDF esiste): bozza `.msg` con il template \"versione definitiva\" e il PDF allegato; poi **Segna definitivo inviato** chiude il ciclo (`definitivo_inviato: true`).\n\n### Riporta in bozza\n\nPer rettificare un resoconto già inviato: **Riporta in bozza** riporta `.md` e `.docx` nella cartella del rilascio, elimina il `.msg` obsoleto, azzera `inviato` e la scadenza, rimette ❌ nella scheda. Si corregge, si rigenera il `.docx` e al prossimo invio si segna di nuovo inviato.\n\n### Convocazioni\n\n**Convoca startup** e **Convoca collaudo** (dal dettaglio rilascio; nella versione Python nella card Azioni) producono `ADMxxx-xx-xX - AAAAMMGG Convocazione Startup.eml` / `… Convocazione Collaudo.eml` nella cartella del rilascio: la `.eml` **è essa stessa l'invito** (invito calendario incorporato), basta aprirla in Outlook e premere Invia. Destinatari dai ruoli della scheda (A = RA, in copia RP, RB e SOGEI; per la startup anche il referente SOGEI del frontmatter); chi non ha l'email in Anagrafica è segnalato nell'esito e va aggiunto in Outlook. Data proposta: startup 7 giorni lavorativi dopo oggi; collaudo dalla disponibilità a collaudo + 20 giorni, 15 (o 10) giorni prima, mai nel weekend (campo vuoto con avviso se la disponibilità è `DA COMPLETARE`). Ora `HH:MM`, mai tra le 12:30 e le 14:00; conferma se la data cade di sabato o domenica. Startup: fino a tre date alternative nel corpo. Collaudo: PDF del piano di test (fra quelli del rilascio e di `_fonti/`), documento di analisi e casi di test, precompilati dal `… Piano di Test.md` del rilascio se c'è; crea anche il **Verbale di Collaudo** (mai sovrascritto). Il mittente (organizzatore dell'invito) è il PM della dashboard `PO 2026.md`, modificabile nella finestra.\n\n**Cambio di data del collaudo:** una nuova convocazione con un'altra data elimina la bozza `.eml` precedente non ancora segnata inviata e rinomina il Verbale alla nuova data conservando le spunte (anche quelle fatte in Obsidian), purché il collaudo non risulti già svolto (esito complessivo compilato, data del Verbale già passata o `data_collaudo_effettiva` nella scheda): in quel caso il vecchio Verbale resta e se ne crea uno nuovo.\n\n### Verbale di Collaudo\n\nLa convocazione del collaudo crea `ADMxxx-xx-xX - AAAAMMGG Verbale di Collaudo.md` con l'elenco delle verifiche. L'editor del Verbale (dal dettaglio rilascio) permette di segnare ogni verifica come superata o non superata, con data, tester e note, e l'esito complessivo (positivo, con riserva, negativo): riepilogo e dettaglio restano allineati. Il resoconto di collaudo prende da qui i casi di test e l'esito.\n\n### Lettere di fine collaudo\n\nDal dettaglio del rilascio (nella versione Python nella card Azioni), **Lettere di fine collaudo** compila i template Word `Template - ADMXXX-XX-XX Trasmissione copia verbale di collaudo.docx` e `… Richiesta estensione in esercizio.docx` e scrive i `.docx` nella cartella del rilascio (`ADMxxx-xx-xX Trasmissione copia verbale di collaudo.docx`, `ADMxxx-xx-xX - Richiesta estensione in esercizio.docx`), gli stessi nomi che Da firmare cerca. La finestra propone, modificabili: la tabella del Piano Operativo dalla scheda; i rappresentanti ADM e SOGEI dal resoconto di collaudo (altrimenti dal CSV presenze del collaudo, altrimenti dal team della scheda), un nome per riga in forma Cognome Nome (i cognomi composti con particella — De Luca, Lo Presti, Della Valle — vengono riconosciuti; per gli altri scrivi `Cognome | Nome`); l'esito dal Verbale (POSITIVO · con riserva · NEGATIVO: con NEGATIVO la Richiesta estensione parte deselezionata); per la Richiesta estensione la Direzione e l'Ufficio del referente business, ricavati dall'Anagrafica (Direzione dal nodo Strutture, Ufficio come \"Ufficio\" + denominazione dell'organigramma in iniziali maiuscole) e l'Area di Staff. **Rileggi sempre l'intestazione in Word prima della firma**: la denominazione dell'ufficio è una convenzione, non un dato. Solo i segnaposto vengono sostituiti: tab, rientri e firma del Dirigente restano quelli del template; la riga `Prot.:` la compila la protocollazione.\n\nUna lettera già presente non viene toccata (\"esistente, non sovrascritta\"); con **Sovrascrivi** viene riscritta e la cartella `da mandare in firma/<Lettera>/` viene svuotata, così il sync del PC master rifà i PDF dalla lettera nuova (li rifà solo se la cartella è vuota). I PDF per Arcipelago e la cartella restano al sync del master (Word). Ciclone `data_collaudo_effettiva` le lettere si creano comunque, ma compaiono in Da firmare solo quando il collaudo è registrato come svolto.\n\n---\n\n## Cruscotto\n\nCinque viste, le stesse delle pagine generate in Obsidian, calcolate al volo dai file del vault.\n\n### Scadenze\n\nQuattro sezioni: **Tassative** (convocazione del collaudo entro 20 giorni dalla disponibilità a collaudo: obbligo normativo, con nota \"provvisoria\" finché il protocollo ADM non è noto), **Scadute**, **Questa settimana**, **Prossime**. Vi compaiono le milestone delle schede (fine analisi, collaudo previsto, rilascio previsto), le azioni aperte con data e le scadenze di approvazione tacita dei resoconti inviati.\n\n### Bozze da inviare\n\n- **Approvazioni tacite scadute**: resoconti inviati oltre la scadenza senza approvazione → Chiudi approvazione.\n- **Bozze iniziali**: resoconti pronti nella cartella del rilascio, con lo stato di `.docx` e `.msg` → Segna inviato (chiede conferma se manca il `.msg` e ricorda la scadenza +5 giorni lavorativi).\n- **Convocazioni da inviare**: le `.eml` di startup e collaudo → Segna inviata (sposta in `inviati/`).\n- **Definitivi**: resoconti approvati di cui manca l'invio della versione definitiva → Segna definitivo inviato.\n\nUn resoconto di collaudo precompilato prima della riunione **non** compare tra le bozze finché la scheda non ha `data_collaudo_effettiva` (vedi \"Da collaudare\").\n\n### Da collaudare\n\nPunti di piano con disponibilità a collaudo ricevuta e collaudo non ancora svolto. Il campo **Data collaudo effettiva** registra la riunione avvenuta (mai una data futura; conferma richiesta se cade di sabato o domenica) e fa rientrare il resoconto di collaudo nel flusso delle bozze.\n\n### Da firmare\n\nLettere di fine collaudo (Trasmissione copia verbale · Richiesta estensione in esercizio) presenti nella cartella del rilascio: **da mandare in firma** e **in attesa di protocollazione**. I pulsanti registrano i passaggi (`in_firma`, `protocollata`); nella versione Python \"Prepara cartella firma\" produce la cartella con i PDF (il sync del master lo fa da solo); nella Web i `.docx` delle lettere si creano con \"Lettere di fine collaudo\" nel dettaglio rilascio.\n\n### Stato invii\n\nMatrice punti di piano × fase: per ogni resoconto **P** = provvisorio inviato, **D** = definitivo inviato, con il link al file. Sola lettura: gli stati si cambiano da \"Bozze da inviare\".\n\n---\n\n## Anagrafica\n\nElenco delle persone del vault (`Anagrafica/<Cognome Nome>.md`) con filtro per nome, organizzazione, direzione e ufficio. **Nuova persona** crea la scheda con organizzazione, direzione, ufficio, email e ruolo tipico; la stessa cosa si può fare al volo dai campi persona di Modifica scheda, Nuovo punto di piano e del selettore dei partecipanti. I nodi delle strutture (direzioni, uffici) stanno in `Anagrafica/Strutture/`.\n\n---\n\n## Azioni e Sync (versione Python)\n\nLa pagina **Azioni** raccoglie le operazioni che lanciano gli script del vault: daily check, rigenerazione delle pagine, schede dall'Excel PO, strutture, refresh Anagrafica, audit degli invii, organizzazione delle cartelle Outlook. Ogni pulsante è disabilitato, con il motivo, quando manca un prerequisito (Outlook, Word, pandoc) o quando l'azione è riservata al PC **master**.\n\nIl pulsante **Sync** esegue `scripts/sync.py`: allinea il vault con git, genera i `.msg` mancanti, ricostruisce la cartella locale `Bozze da inviare/`, archivia gli inviati e, sul master, chiude le approvazioni tacite e rigenera i `.docx` superati. **Durante un'azione ogni scrittura dell'app è sospesa** (banner in alto), così nessun file si sposta mentre git lavora. **Log azioni** mostra la cronologia delle esecuzioni.\n\n**Vault senza git.** La versione web e il pack dimostrativo sono strumenti autonomi sul PC di utilizzo: non scrivono mai su git. Se il vault non è un repository git, il sync salta pull e push e fa solo il ricalcolo locale (pagine, Bozze da inviare, archiviazione, `.msg` mancanti con Outlook, PDF con Word).\n\n**Ruoli dei PC.** `scripts/machines.json` assegna a ogni hostname il ruolo master o slave: il master è l'unico che esegue l'automazione mutante; gli slave leggono, scrivono e sincronizzano. **Riavvia backend** (nel menu) riavvia il server in una nuova console.\n\n---\n\n## Regole comuni e casi particolari\n\n- **Conflitti di modifica.** Prima di scrivere, l'app verifica che il file non sia cambiato sul disco da quando lo ha letto (nella versione Web: data di modifica e contenuto). In caso di conflitto compare **Ricarica**: il file viene riletto senza svuotare il modulo, poi si risalva.\n- **Fine settimana.** I campi data delle riunioni chiedono conferma se la data cade di sabato o domenica; \"Cambia data\" svuota il campo.\n- **Pausa pranzo.** Le convocazioni non possono iniziare tra le 12:30 e le 14:00.\n- **Formato dei file.** I file esistenti conservano i fine riga (CRLF) e l'eventuale BOM; i file nuovi sono in UTF-8 con LF. Il frontmatter si aggiorna chiave per chiave, senza riscrivere il resto.\n- **Pagine generate.** Rilasci, Riunioni, Bozze da inviare, Stato invii, Scadenze, Da collaudare e Da firmare in `PO <anno>/` sono prodotte dagli script: le viste dell'app mostrano gli stessi dati, non vanno editate a mano.\n- **Contratto dei dati.** Campi, formati e chi legge/scrive ogni sezione sono descritti in `SCHEMA.md`.\n\n---\n\n## Versione Web: differenze\n\n| Funzione | Python | Web |\n|---|---|---|\n| Lettura di rilasci, resoconti, note, Anagrafica | sì | sì |\n| Modifica scheda, Nuovo punto di piano, Nuova persona | sì | sì |\n| Nuovo resoconto, editor a sezioni, Verbale, Riporta in bozza, partecipanti dal CSV presenze | sì | sì |\n| Carica fonti (trascritti → `.md`, CSV presenze → Anagrafica, riga Riunioni), protocolli in Modifica scheda | sì | sì (i `.docx` convertiti dall'app, senza pandoc) |\n| Cruscotto con Segna inviato, Chiudi approvazione, collaudo effettivo, lettere | sì | sì |\n| Rigenera .docx, Genera mail `.msg`, Mail definitiva | sì | sì (il `.msg` del browser porta la firma del template) |\n| Convocazioni startup e collaudo (`.eml` con invito, PDF del piano di test, Verbale) | sì | sì (organizzatore dalla dashboard; al cambio di data bozza precedente eliminata e Verbale rinominato) |\n| Lettere di fine collaudo (`.docx` dai template, dati dalla scheda/resoconto/Verbale/Anagrafica) | sì | sì |\n| PDF e cartella `da mandare in firma/` | sì (Word) | no: li produce il sync del PC master |\n| Azioni, Sync, Log azioni, Riavvia backend, ricerca Ctrl+K, Apri in Outlook/Apri cartella | sì | no |\n| Requisiti | Python 3.12, Outlook/Word/pandoc per le azioni | Edge o Chrome (103 o successivi per Word e mail) |\n\nNella versione Web ogni scrittura passa dalle stesse regole del codice Python (chiavi cambiate, sezioni cambiate, scadenze a +5 giorni lavorativi, ✅/❌ nella scheda), verificate dagli stessi dati di riferimento.\n";
